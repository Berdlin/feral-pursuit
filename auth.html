<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Pursuit - Access</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vt323&display=swap');

        body {
            background-color: #050505;
            color: #0f0;
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, #001100 2px, #001100 4px);
        }

        .container {
            width: 400px;
            padding: 30px;
            border: 4px solid #0f0;
            box-shadow: 0 0 20px #0f0;
            background: #000;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin: 0 0 20px 0;
            text-shadow: 0 0 10px #0f0;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }

        .tab {
            cursor: pointer;
            padding: 10px;
            font-size: 1.5em;
            width: 50%;
            opacity: 0.5;
        }

        .tab.active {
            border-bottom: 4px solid #0f0;
            opacity: 1;
            text-shadow: 0 0 8px #0f0;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #111;
            border: 2px solid #333;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 1.5em;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #0f0;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #003300;
            color: #0f0;
            border: 2px solid #0f0;
            font-family: 'VT323', monospace;
            font-size: 1.8em;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }

        #msg {
            min-height: 30px;
            margin-top: 10px;
            color: #ff4500;
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>FERAL ACCESS</h1>
        <div class="tabs">
            <div class="tab active" onclick="setMode('login')" id="tabLogin">LOGIN</div>
            <div class="tab" onclick="setMode('register')" id="tabReg">REGISTER</div>
        </div>

        <div id="formBox">
            <input type="text" id="username" placeholder="CODENAME" maxlength="12">
            <input type="password" id="password" placeholder="PASSPHRASE">
            <button class="btn" onclick="submitAuth()" id="actionBtn">INITIATE LINK</button>
        </div>
        <div id="msg"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let mode = 'login';

        function setMode(m) {
            mode = m;
            document.getElementById('tabLogin').className = m === 'login' ? 'tab active' : 'tab';
            document.getElementById('tabReg').className = m === 'register' ? 'tab active' : 'tab';
            document.getElementById('actionBtn').innerText = m === 'login' ? 'INITIATE LINK' : 'CREATE IDENTITY';
        }

        function submitAuth() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) { document.getElementById('msg').innerText = "CREDENTIALS REQUIRED"; return; }

            document.getElementById('msg').innerText = "PROCESSING...";
            document.getElementById('msg').style.color = "#ffff00";

            socket.emit('authRequest', { type: mode, user, pass });
        }

        socket.on('authResponse', (res) => {
            if (res.success) {
                localStorage.setItem('gameUsername', res.user);
                localStorage.setItem('gamePass', res.pass); // Basic persistence
                document.getElementById('msg').style.color = "#0f0";
                document.getElementById('msg').innerText = "ACCESS GRANTED";
                setTimeout(() => window.location.href = 'gameintro.html', 1000);
            } else {
                document.getElementById('msg').style.color = "#ff4500";
                document.getElementById('msg').innerText = res.msg;
            }
        });
    </script>
</body>

</html>
