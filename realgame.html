<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feral Pursuit - Survival</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #080808;
            color: #ccc;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .game-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .game-stage {
            flex-grow: 1;
            position: relative;
            background-color: #050805;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 2s ease-in-out;
        }

        /* SCARY MODE VISUALS */
        .game-stage.scary-mode {
            filter: sepia(0.6) hue-rotate(-50deg) contrast(1.3) brightness(0.7);
        }

        #mapViewport {
            width: 1500px;
            height: 1500px;
            background-color: #0c180f;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            border: 5px solid #222;
            position: absolute;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        #bloodMoonOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.1), rgba(100, 0, 0, 0.6));
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        /* BOSS BAR */
        #bossBarContainer {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 25px;
            background: #333;
            border: 2px solid white;
            box-shadow: 0 0 15px red;
            z-index: 200;
            display: none;
        }

        #bossBarFill {
            width: 100%;
            height: 100%;
            background: #a00;
            transition: width 0.2s;
        }

        #bossName {
            position: absolute;
            top: -25px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 0 0 5px black;
        }

        .inventory-sidebar {
            width: 280px;
            background-color: #111;
            border-right: 2px solid #333;
            height: 100vh;
            position: absolute;
            left: 0;
            top: 0;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .inventory-sidebar.visible {
            transform: translateX(0);
        }

        .inv-item {
            background: #222;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* ADMIN PANEL */
        #adminPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ff00;
            padding: 20px;
            z-index: 300;
            display: none;
            color: #00ff00;
            font-family: monospace;
            box-shadow: 0 0 20px #00ff00;
            max-height: 80vh;
            overflow-y: auto;
        }

        .admin-row {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-btn {
            width: 100%;
            background: #003300;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: bold;
        }

        .admin-btn:hover {
            background: #005500;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #111;
            color: green;
            border: 1px solid green;
            cursor: pointer;
        }

        .tab-btn.active {
            background: green;
            color: black;
        }

        .icon {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            z-index: 10;
        }

        #playerIcon {
            background: #ff4500;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .wolf-entity {
            width: 50px;
            height: 50px;
            background: #200;
            border-radius: 50%;
            border: 2px solid #f00;
            z-index: 9;
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
        }

        .white-wolf {
            background: #fff;
            border: 3px solid gold;
            width: 100px;
            height: 100px;
            font-size: 4em;
            box-shadow: 0 0 30px white;
            z-index: 15;
            color: black;
        }

        .chest {
            z-index: 8;
            cursor: pointer;
            font-size: 2em;
            filter: drop-shadow(0 0 5px gold);
        }

        #gameOverOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }

        .overlay-btn {
            margin: 10px;
            padding: 15px 30px;
            background: #ff4500;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 1.2em;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 150;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            color: white;
        }

        #topAlertBox {
            position: absolute;
            top: 120px;
            width: 100%;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            z-index: 160;
            text-shadow: 0 0 5px black;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>

<body>
    <div id="bloodMoonOverlay"></div>

    <div id="bossBarContainer">
        <div id="bossName">THE WHITE WOLF</div>
        <div id="bossBarFill"></div>
    </div>

    <div class="game-wrapper">
        <div id="inventoryPanel" class="inventory-sidebar">
            <div style="padding: 20px; text-align: center; color: #ff4500;">INVENTORY [Q]</div>
            <div id="invList" style="padding:10px;"></div>
        </div>

        <div class="hud-top">
            <div>DAY: <span id="levelDisplay">1</span></div>
            <div>HP: <span id="hpDisplay">100</span></div>
            <div>COINS: <span id="coinDisplay">0</span></div>
            <div>TIME: <span id="timeDisplay">00:20</span></div>
        </div>

        <div id="topAlertBox"></div>

        <div id="adminPanel">
            <div style="display:flex; margin-bottom:10px;">
                <button class="tab-btn active">LOCAL ADMIN</button>
            </div>
            <div class="admin-row"><label>Set Day:</label><input type="number" id="admDay" value="1"
                    style="width:50px;"><button class="admin-btn" style="width:auto" onclick="admSetDay()">SET</button>
            </div>
            <div class="admin-row"><label>HP / DMG:</label><input type="number" id="admHp" value="100"
                    style="width:40px;"><input type="number" id="admDmg" value="10" style="width:40px;"><button
                    class="admin-btn" style="width:auto" onclick="admSetStats()">SET</button></div>
            <button class="admin-btn" onclick="admSpawnDogs()">SPAWN DOGS (5)</button>
            <button class="admin-btn" onclick="spawnChests(currentLevel)">RESPAWN CHESTS</button>
            <button class="admin-btn" onclick="admGetStuff()">GET OP ITEMS</button>
            <button class="admin-btn" onclick="admSpawnWhiteWolf()" style="color:black; background:gold;">SPAWN WHITE
                WOLF (BOSS)</button>
            <button class="admin-btn" onclick="admKillWolves()" style="background:#500;">KILL ALL WOLVES</button>
            <button class="admin-btn"
                onclick="document.getElementById('adminPanel').style.display='none'">CLOSE</button>
        </div>

        <div class="game-stage" id="stage">
            <div id="mapViewport">
                <div id="playerIcon" class="icon">🏃</div>
                <div id="wolvesContainer"></div>
                <div id="companionsContainer"></div>
                <div id="mapItems"></div>
            </div>
        </div>
    </div>

    <div id="gameOverOverlay">
        <h1 id="endTitle" style="color:white; font-size:3em;">GAME OVER</h1>
        <h2 id="daysSurvivedText" style="color: #ffaa00;"></h2>
        <div id="coinEarnedMsg" style="color:gold; margin-bottom:10px; font-size:1.5em;"></div>
        <p id="endReason" style="color:#aaa; font-size:1.5em; margin-bottom: 30px;"></p>
        <button onclick="location.reload()" class="overlay-btn">RESTART</button>
        <button onclick="location.href='gameintro.html'" class="overlay-btn" style="background:#555">MAIN MENU</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Used for score reporting only
        let player = { x: 750, y: 750, hp: 100, maxHp: 100, dmg: 10, speed: 7, invulnerable: false };
        let gameState = 'collection'; // collection, chase, over
        let currentLevel = 1;
        let coins = parseInt(localStorage.getItem('feral_coins') || "0");
        let wolves = [], chests = [], companions = [], items = [];
        let keyStates = {};
        let timeLeft = 25;
        let gameLoopId, timerLoopId;
        const MAP_SIZE = 1500;

        // AUDIO SYSTEM
        const audio = {
            step: new Audio('footstep.mp3'),
            scary: new Audio('scary_theme.mp3'),
            growl: new Audio('wolf_growl.mp3'),
            jump: new Audio('jumpscare.mp3')
        };
        // Setup loop for scary theme
        audio.scary.loop = true;
        Object.values(audio).forEach(a => a.volume = 0.3);

        function init() {
            document.getElementById('coinDisplay').innerText = coins;
            spawnChests(1);
            spawnWolves(1);
            window.addEventListener('keydown', handleDown);
            window.addEventListener('keyup', (e) => keyStates[e.key.toLowerCase()] = false);
            gameLoopId = requestAnimationFrame(gameLoop);
            timerLoopId = setInterval(timerLogic, 1000);
            showAlert("DAY 1: SCAVENGE", "white");
        }

        function gameLoop() {
            if (gameState === 'over') return;
            // Movement
            let dx = 0, dy = 0;
            if (keyStates['w']) dy--; if (keyStates['s']) dy++;
            if (keyStates['a']) dx--; if (keyStates['d']) dx++;
            if (dx || dy) {
                const len = Math.sqrt(dx * dx + dy * dy);
                player.x += (dx / len) * player.speed;
                player.y += (dy / len) * player.speed;
                player.x = Math.max(20, Math.min(MAP_SIZE - 20, player.x));
                player.y = Math.max(20, Math.min(MAP_SIZE - 20, player.y));

                // Play step sound
                if (audio.step.paused) audio.step.play();
            } else {
                audio.step.pause();
                audio.step.currentTime = 0;
            }

            // Camera
            const stage = document.getElementById('stage');
            let cx = (stage.clientWidth / 2) - player.x;
            let cy = (stage.clientHeight / 2) - player.y;
            document.getElementById('mapViewport').style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
            document.getElementById('playerIcon').style.left = player.x + 'px';
            document.getElementById('playerIcon').style.top = player.y + 'px';

            // Wolf AI
            if (gameState === 'chase') {
                wolves.forEach(w => {
                    if (w.hp <= 0) { document.getElementById(`wolf-${w.id}`).style.display = 'none'; return; }
                    const el = document.getElementById(`wolf-${w.id}`);
                    el.style.display = 'flex';

                    // Logic for white wolf boss
                    const speed = w.isBoss ? 5.5 : 5;
                    const angle = Math.atan2(player.y - w.y, player.x - w.x);
                    w.x += Math.cos(angle) * speed;
                    w.y += Math.sin(angle) * speed;
                    el.style.left = w.x + 'px'; el.style.top = w.y + 'px';

                    // Collision
                    if (Math.hypot(player.x - w.x, player.y - w.y) < (w.isBoss ? 80 : 40) && !player.invulnerable) {
                        player.hp -= w.dmg;
                        hitEffect();
                        if (player.hp <= 0) endGame(false, "Eaten Alive");
                    }
                });
            }

            // Companion AI
            companions.forEach((dog, i) => {
                let target = wolves.find(w => w.hp > 0 && Math.hypot(w.x - dog.x, w.y - dog.y) < 300);
                if (!target) target = player;
                const angle = Math.atan2(target.y - dog.y, target.x - dog.x);
                dog.x += Math.cos(angle) * 6; dog.y += Math.sin(angle) * 6;

                const el = document.getElementById(`comp-${i}`);
                if (el) { el.style.left = dog.x + 'px'; el.style.top = dog.y + 'px'; }

                if (target !== player && Math.hypot(target.x - dog.x, target.y - dog.y) < 50) {
                    target.hp -= dog.dmg;
                    if (target.isBoss) updateBossBar(target.hp, target.maxHp);
                    if (target.hp <= 0) checkVictory();
                }
            });

            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function handleDown(e) {
            keyStates[e.key.toLowerCase()] = true;
            if (e.key === ' ' || e.key === 'Enter') attack();
            if (e.key === 'e') loot();
            if (e.key === 'q') document.getElementById('inventoryPanel').classList.toggle('visible');

            // ADMIN CHECK: Shift + A, Username MUST be 'beka_ei'
            if (e.shiftKey && e.key.toLowerCase() === 'a') {
                const user = localStorage.getItem('gameUsername');
                if (user && user.toLowerCase() === 'beka_ei') {
                    document.getElementById('adminPanel').style.display = 'block';
                } else {
                    showAlert("ACCESS DENIED", "red");
                }
            }
            if (e.key >= '1' && e.key <= '9') useItem(parseInt(e.key) - 1);
        }

        function attack() {
            // Visual FX
            const fx = document.createElement('div');
            fx.style.border = '2px solid white'; fx.style.borderRadius = '50%'; fx.style.position = 'absolute';
            fx.style.width = '120px'; fx.style.height = '120px'; fx.style.left = player.x + 'px'; fx.style.top = player.y + 'px';
            fx.style.transform = 'translate(-50%, -50%)'; document.getElementById('mapViewport').appendChild(fx);
            setTimeout(() => fx.remove(), 200);

            wolves.forEach(w => {
                if (w.hp > 0 && Math.hypot(w.x - player.x, w.y - player.y) < 120) {
                    w.hp -= player.dmg;
                    if (w.isBoss) updateBossBar(w.hp, w.maxHp);
                    if (w.hp <= 0) checkVictory();
                }
            });
        }

        function loot() {
            chests.forEach((c, i) => {
                if (!c.opened && Math.hypot(player.x - c.x, player.y - c.y) < 80) {
                    c.opened = true; document.getElementById(`chest-${i}`).remove();
                    items.push(c.reward); renderInv(); showAlert("ITEM GET: " + c.reward.name, "gold");
                }
            });
        }

        function checkVictory() {
            if (wolves.every(w => w.hp <= 0)) {
                // Check for boss reward
                const boss = wolves.find(w => w.isBoss);
                if (boss) {
                    currentLevel += 50; coins += 20;
                    localStorage.setItem('feral_coins', coins);
                    showAlert("BOSS DEFEATED! +50 DAYS, +20 COINS", "gold");
                    document.getElementById('bossBarContainer').style.display = 'none';
                } else {
                    currentLevel++;
                }

                timeLeft = 25; gameState = 'collection';
                document.getElementById('stage').classList.remove('scary-mode');
                document.getElementById('bloodMoonOverlay').style.opacity = 0;
                audio.scary.pause();
                audio.step.volume = 0.3; // Reset volume

                spawnChests(currentLevel); spawnWolves(currentLevel);
                showAlert(`DAY ${currentLevel}`, "cyan");
            }
        }

        function timerLogic() {
            if (gameState !== 'collection') return;
            timeLeft--;
            if (timeLeft <= 0) {
                gameState = 'chase';
                // Trigger Scary Mode
                document.getElementById('stage').classList.add('scary-mode');
                document.getElementById('bloodMoonOverlay').style.opacity = 0.5;
                audio.growl.play();
                audio.scary.currentTime = 0;
                audio.scary.play();
                showAlert("THE HUNT BEGINS", "red");
            }
        }

        // --- ENTITY SPAWNING ---
        function spawnWolves(lvl) {
            wolves = [];
            const container = document.getElementById('wolvesContainer'); container.innerHTML = '';
            let count = Math.min(lvl + 1, 50);
            for (let i = 0; i < count; i++) {
                let w = { id: i, x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, hp: lvl * 80, maxHp: lvl * 80, dmg: lvl * 5, isBoss: false };
                wolves.push(w);
                const el = document.createElement('div'); el.className = 'wolf-entity'; el.id = `wolf-${i}`; el.innerText = '🐺'; el.style.display = 'none';
                container.appendChild(el);
            }
        }

        function spawnChests(lvl) {
            chests = [];
            const container = document.getElementById('mapItems'); container.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                chests.push({ x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE, opened: false, reward: generateReward(lvl) });
                const el = document.createElement('div'); el.className = 'icon chest'; el.innerText = '📦'; el.id = `chest-${i}`;
                el.style.left = chests[i].x + 'px'; el.style.top = chests[i].y + 'px';
                container.appendChild(el);
            }
        }

        function generateReward(level) {
            const r = Math.random();
            if (r < 0.4) return { name: 'Potion', type: 'hp', val: 50, icon: '🍷' };
            if (r < 0.7) return { name: 'Sword', type: 'sword', val: 10, icon: '⚔️' };
            return { name: 'Dog Whistle', type: 'dog', val: 1, icon: '🐕' };
        }

        // --- ADMIN FUNCTIONS ---
        function admSpawnWhiteWolf() {
            const w = { id: 999, x: MAP_SIZE / 2, y: MAP_SIZE / 2, hp: 10000, maxHp: 10000, dmg: 100, isBoss: true };
            wolves.push(w);
            const el = document.createElement('div'); el.className = 'wolf-entity white-wolf'; el.id = `wolf-999`; el.innerText = '🐺';
            el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
            document.getElementById('wolvesContainer').appendChild(el);

            document.getElementById('bossBarContainer').style.display = 'block';
            updateBossBar(10000, 10000);
            showAlert("THE WHITE WOLF HAS AWOKEN", "white");
            audio.growl.play();
        }

        function admKillWolves() { wolves.forEach(w => w.hp = 0); checkVictory(); }
        function admGetStuff() {
            items.push({ name: 'God Sword', type: 'sword', val: 500, icon: '⚔️' });
            items.push({ name: 'Elixir', type: 'hp', val: 9999, icon: '🍷' });
            renderInv();
        }
        function admSpawnDogs() { for (let i = 0; i < 5; i++) companions.push({ x: player.x, y: player.y, hp: 500, dmg: 50 }); renderDogs(); }
        function admSetDay() { currentLevel = parseInt(document.getElementById('admDay').value); spawnWolves(currentLevel); showAlert("Day Set", "lime"); }
        function admSetStats() { player.hp = parseInt(document.getElementById('admHp').value); player.dmg = parseInt(document.getElementById('admDmg').value); }

        // --- UTILS ---
        function updateBossBar(hp, max) {
            document.getElementById('bossBarFill').style.width = Math.max(0, (hp / max * 100)) + '%';
        }
        function updateHUD() {
            document.getElementById('hpDisplay').innerText = player.hp;
            document.getElementById('levelDisplay').innerText = currentLevel;
            document.getElementById('coinDisplay').innerText = coins;
            document.getElementById('timeDisplay').innerText = gameState === 'collection' ? timeLeft : 'HUNT';
        }
        function hitEffect() {
            player.invulnerable = true; document.getElementById('playerIcon').style.opacity = 0.5;
            setTimeout(() => { player.invulnerable = false; document.getElementById('playerIcon').style.opacity = 1; }, 1000);
        }
        function renderInv() {
            const l = document.getElementById('invList'); l.innerHTML = '';
            items.forEach((it, i) => { l.innerHTML += `<div class="inv-item" onclick="useItem(${i})">${it.icon} ${it.name}</div>`; });
        }
        function useItem(i) {
            if (!items[i]) return;
            const it = items[i];
            if (it.type === 'hp') player.hp += it.val;
            if (it.type === 'sword') player.dmg += it.val;
            if (it.type === 'dog') { companions.push({ x: player.x, y: player.y, hp: 200, dmg: 20 }); renderDogs(); }
            items.splice(i, 1); renderInv();
        }
        function renderDogs() {
            const c = document.getElementById('companionsContainer'); c.innerHTML = '';
            companions.forEach((d, i) => { c.innerHTML += `<div id="comp-${i}" class="wolf-entity" style="background:#00f; border-color:#fff;">🐕</div>`; });
        }
        function showAlert(msg, col) {
            const el = document.getElementById('topAlertBox'); el.innerText = msg; el.style.color = col; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 3000);
        }
        function endGame(win, reason) {
            gameState = 'over';
            audio.scary.pause();
            audio.jump.play();
            document.getElementById('gameOverOverlay').style.display = 'flex';
            document.getElementById('endTitle').innerText = win ? "VICTORY" : "DEFEAT";
            document.getElementById('endReason').innerText = reason;
            document.getElementById('daysSurvivedText').innerText = "Day " + currentLevel;

            const earned = win ? 0 : 5;
            if (earned > 0) {
                coins += earned;
                localStorage.setItem('feral_coins', coins);
                document.getElementById('coinEarnedMsg').innerText = `+${earned} Coins`;
            }

            const oldBest = parseInt(localStorage.getItem('feral_personalBest') || "0");
            if (currentLevel > oldBest) {
                localStorage.setItem('feral_personalBest', currentLevel);
                coins += 10;
                localStorage.setItem('feral_coins', coins);
                document.getElementById('coinEarnedMsg').innerText += " (Record Bonus +10)";
                socket.emit('reportScore', { username: localStorage.getItem('gameUsername') || "Solo", days: currentLevel });
            }
        }

        init();
    </script>
</body>

</html>
