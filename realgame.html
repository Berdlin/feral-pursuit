<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Survival</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: monospace;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #080f08;
        }

        #camera {
            position: absolute;
            top: 0;
            left: 0;
            width: 1500px;
            height: 1500px;
            background-image: radial-gradient(#1a2b1a 2px, transparent 2px);
            background-size: 50px 50px;
            border: 5px solid #333;
        }

        /* PIXEL ART STYLES */
        .entity {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 30px;
            line-height: 40px;
        }

        .player {
            background: url('https://img.icons8.com/color/48/pixel-cat.png') no-repeat center/cover;
            filter: drop-shadow(0 0 5px lime);
        }

        .wolf {
            background: url('https://img.icons8.com/color/48/werewolf.png') no-repeat center/cover;
            filter: drop-shadow(0 0 10px red);
            transition: left 0.1s, top 0.1s;
        }

        .white-wolf {
            filter: drop-shadow(0 0 20px white) hue-rotate(180deg);
            transform: scale(1.5) translate(-50%, -50%);
        }

        .tree {
            position: absolute;
            font-size: 60px;
            pointer-events: none;
            z-index: 10;
            filter: brightness(0.5);
        }

        .chest {
            position: absolute;
            font-size: 30px;
            z-index: 5;
        }

        /* ATMOSPHERE */
        #lighting {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 20%, #000 90%);
            z-index: 100;
            transition: background 2s;
        }

        #bloodmoon {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: red;
            opacity: 0;
            pointer-events: none;
            z-index: 90;
            transition: opacity 2s;
            mix-blend-mode: multiply;
        }

        /* UI */
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 200;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
        }

        #admin {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 2px solid lime;
            padding: 20px;
            z-index: 300;
            color: lime;
            width: 300px;
        }

        .admin-btn {
            width: 100%;
            margin: 5px 0;
            background: #003300;
            color: lime;
            border: 1px solid lime;
            padding: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="lighting"></div>
    <div id="bloodmoon"></div>

    <div id="hud">
        DAY: <span id="dayDisp">1</span> | HP: <span id="hpDisp">100</span> | <span id="timerDisp">PREPARE</span>
    </div>

    <div id="game">
        <div id="camera">
            <div id="player" class="entity player"></div>
            <div id="entities"></div>
            <div id="trees"></div>
        </div>
    </div>

    <div id="admin">
        <h2 style="margin-top:0;">ADMIN CONSOLE</h2>
        <button class="admin-btn" onclick="execAdmin('kill')">KILL ALL WOLVES</button>
        <button class="admin-btn" onclick="execAdmin('white')">SPAWN WHITE WOLF</button>
        <button class="admin-btn" onclick="execAdmin('hp')">RESTORE HP</button>
        <button class="admin-btn" onclick="execAdmin('day')">+10 DAYS</button>
        <div style="margin-top:10px; color:white;">Global Chat (Admin):</div>
        <input type="text" id="gChat" style="width:100%; color:black;">
        <button class="admin-btn" onclick="execAdmin('gchat')">BROADCAST</button>
        <button class="admin-btn" style="background:#300; border-color:red;" onclick="toggleAdmin()">CLOSE</button>
    </div>

    <audio id="s_step" src="https://assets.mixkit.co/active_storage/sfx/2064/2064-preview.mp3"></audio>
    <audio id="s_howl" src="https://assets.mixkit.co/active_storage/sfx/2591/2591-preview.mp3"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const user = JSON.parse(localStorage.getItem('fp_user'));
        const pClass = localStorage.getItem('fp_class') || 'default';

        let player = { x: 750, y: 750, hp: 100, dmg: 10, speed: 7 };
        if (pClass === 'medic') player.hp = 150;
        if (pClass === 'starter') player.dmg = 15;

        let wolves = [];
        let day = 1;
        let state = 'safe'; // safe | hunt
        let timer = 25;

        // Setup Map
        function initMap() {
            const t = document.getElementById('trees');
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div'); el.className = 'tree'; el.innerText = '🌲';
                el.style.left = Math.random() * 1400 + 'px'; el.style.top = Math.random() * 1400 + 'px';
                t.appendChild(el);
            }
        }
        initMap();

        // Game Loop
        const keys = {};
        window.onkeydown = (e) => {
            keys[e.key] = true;
            if (e.key === ' ' && state === 'hunt') attack();
            if (e.shiftKey && e.key === 'A') toggleAdmin();
        };
        window.onkeyup = (e) => keys[e.key] = false;

        function loop() {
            let dx = 0, dy = 0;
            if (keys['w']) dy--; if (keys['s']) dy++;
            if (keys['a']) dx--; if (keys['d']) dx++;

            if (dx || dy) {
                player.x += dx * player.speed;
                player.y += dy * player.speed;
                // Move Lighting
                document.getElementById('lighting').style.background =
                    `radial-gradient(circle at ${window.innerWidth / 2}px ${window.innerHeight / 2}px, transparent 20%, #000 95%)`;

                // Sound (Throttled)
                if (Math.random() > 0.8) document.getElementById('s_step').play().catch(() => { });
            }

            // Render Player & Camera
            const cam = document.getElementById('camera');
            cam.style.transform = `translate(${window.innerWidth / 2 - player.x}px, ${window.innerHeight / 2 - player.y}px)`;
            const pl = document.getElementById('player');
            pl.style.left = player.x + 'px'; pl.style.top = player.y + 'px';

            // Wolf Logic
            if (state === 'hunt') {
                wolves.forEach(w => {
                    if (w.hp <= 0) return;
                    const angle = Math.atan2(player.y - w.y, player.x - w.x);
                    w.x += Math.cos(angle) * (4 + day * 0.1);
                    w.y += Math.sin(angle) * (4 + day * 0.1);

                    const el = document.getElementById(`w-${w.id}`);
                    if (el) { el.style.left = w.x + 'px'; el.style.top = w.y + 'px'; }

                    if (Math.hypot(player.x - w.x, player.y - w.y) < 40) {
                        player.hp -= 0.5;
                        updateHud();
                        if (player.hp <= 0) alert("YOU DIED. Refresh to restart.");
                    }
                });
            }

            requestAnimationFrame(loop);
        }
        loop();

        // Admin Logic
        function toggleAdmin() {
            if (user.username !== 'beka_ei') return alert("ACCESS DENIED");
            const a = document.getElementById('admin');
            a.style.display = a.style.display === 'none' ? 'block' : 'none';
        }

        function execAdmin(cmd) {
            if (cmd === 'kill') { wolves = []; document.getElementById('entities').innerHTML = ''; nextDay(); }
            if (cmd === 'white') spawnWolf(true);
            if (cmd === 'hp') { player.hp = 1000; updateHud(); }
            if (cmd === 'gchat') socket.emit('adminCmd', { username: user.username, scope: 'global', cmd: 'globalMsg', val: document.getElementById('gChat').value });
        }

        // Logic Helpers
        function attack() {
            wolves.forEach(w => {
                if (Math.hypot(player.x - w.x, player.y - w.y) < 80) {
                    w.hp -= player.dmg;
                    if (w.hp <= 0) {
                        document.getElementById(`w-${w.id}`).remove();
                        if (w.isWhite) { day += 50; alert("LEGEND SLAIN! +50 Days"); }
                    }
                }
            });
            if (wolves.every(w => w.hp <= 0)) nextDay();
        }

        function nextDay() {
            day++;
            state = 'safe';
            timer = 25;
            document.getElementById('bloodmoon').style.opacity = 0;
            updateHud();
            startTimer();
        }

        function startTimer() {
            const int = setInterval(() => {
                timer--;
                document.getElementById('timerDisp').innerText = timer + 's';
                if (timer <= 0) {
                    clearInterval(int);
                    state = 'hunt';
                    document.getElementById('bloodmoon').style.opacity = 0.6;
                    document.getElementById('s_howl').play();
                    spawnWave();
                }
            }, 1000);
        }

        function spawnWave() {
            for (let i = 0; i < day + 2; i++) spawnWolf();
        }

        function spawnWolf(isWhite = false) {
            const w = { id: Math.random(), x: Math.random() * 1500, y: Math.random() * 1500, hp: isWhite ? 15000 : 50, isWhite: isWhite };
            wolves.push(w);
            const el = document.createElement('div');
            el.className = isWhite ? 'entity wolf white-wolf' : 'entity wolf';
            el.id = `w-${w.id}`;
            document.getElementById('entities').appendChild(el);
        }

        function updateHud() {
            document.getElementById('dayDisp').innerText = day;
            document.getElementById('hpDisp').innerText = Math.floor(player.hp);
        }
        startTimer();
    </script>
</body>

</html>
