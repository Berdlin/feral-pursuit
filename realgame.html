<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feral Pursuit - Survival</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #080808;
            color: #ccc;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
        }

        .game-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .game-stage {
            flex-grow: 1;
            position: relative;
            background-color: #050805;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mapViewport {
            width: 1500px;
            height: 1500px;
            background-color: #0c180f;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            border: 5px solid #222;
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        /* SCARY ATMOSPHERE */
        #bloodMoonOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.1), rgba(100, 0, 0, 0.6));
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #555;
            z-index: 180;
            border-radius: 4px;
            pointer-events: none;
            display: block;
        }

        .mm-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .mm-player {
            background-color: #ff4500;
            width: 6px;
            height: 6px;
            z-index: 2;
            border: 1px solid white;
        }

        .mm-wolf {
            background-color: #f00;
            width: 5px;
            height: 5px;
            box-shadow: 0 0 4px red;
        }

        .mm-chest {
            background-color: #ffd700;
        }

        .mm-dog {
            background-color: #00bfff;
        }

        .inventory-sidebar {
            width: 280px;
            background-color: #111;
            border-right: 2px solid #333;
            height: 100vh;
            position: absolute;
            left: 0;
            top: 0;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .inventory-sidebar.visible {
            transform: translateX(0);
        }

        .inv-header {
            padding: 20px;
            background-color: #1a1a1a;
            text-align: center;
            color: #ff4500;
            font-size: 1.2em;
            border-bottom: 1px solid #333;
        }

        .inv-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            max-height: 90vh;
        }

        .inv-item {
            background: #222;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .key-hint {
            background: #ff4500;
            color: #000;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-size: 0.8em;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 150;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            white-space: nowrap;
        }

        .hud-stat span {
            color: #ff4500;
            font-weight: bold;
        }

        #topAlertBox {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 30px;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            font-size: 1.2em;
            z-index: 150;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 2px solid transparent;
        }

        /* SCROLLABLE ADMIN PANEL */
        #adminPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ff00;
            padding: 20px;
            z-index: 300;
            display: none;
            color: #00ff00;
            font-family: monospace;
            box-shadow: 0 0 20px #00ff00;
            max-height: 80vh;
            overflow-y: auto;
        }

        .admin-row {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-input {
            width: 60px;
            background: #222;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 5px;
            text-align: center;
        }

        .admin-btn {
            width: 100%;
            background: #003300;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        .icon {
            position: absolute;
            transform: translate(-50%, -50%);
            will-change: left, top;
        }

        #playerIcon {
            font-size: 2em;
            width: 40px;
            height: 40px;
            background: #ff4500;
            border-radius: 50%;
            border: 2px solid #fff;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .invulnerable {
            animation: flash 0.2s infinite;
        }

        @keyframes flash {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }

            100% {
                opacity: 1;
            }
        }

        /* SCARIER WOLF */
        .wolf-entity {
            font-size: 2.5em;
            width: 50px;
            height: 50px;
            background: #200;
            border-radius: 50%;
            border: 2px solid #f00;
            z-index: 9;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #f00;
        }

        .bar-container {
            position: absolute;
            top: -10px;
            width: 100%;
            height: 5px;
            background: #444;
            border: 1px solid #000;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.1s;
        }

        .friendly-wolf {
            font-size: 1.5em;
            width: 30px;
            height: 30px;
            background: #00bfff;
            border-radius: 50%;
            border: 2px solid #fff;
            z-index: 9;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%);
        }

        .chest {
            font-size: 1.8em;
            z-index: 8;
            cursor: pointer;
        }

        #storyText {
            position: absolute;
            top: 150px;
            left: 20px;
            width: 250px;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px;
            border-radius: 4px;
            color: #fff;
            border-left: 3px solid #00bfff;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        /* SCROLLABLE DOG STATS */
        #dogStatsModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(10, 15, 30, 0.95);
            border: 2px solid #00bfff;
            border-radius: 10px;
            padding: 20px;
            color: white;
            z-index: 150;
            display: none;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.3);
            max-height: 60vh;
            overflow-y: auto;
        }

        .dog-stat-row {
            border-bottom: 1px solid #444;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        #gameOverOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }

        .overlay-btn {
            margin: 10px;
            padding: 15px 30px;
            background: #ff4500;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 1.2em;
        }

        .attack-range {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: ripple 0.3s linear;
        }

        @keyframes ripple {
            from {
                width: 0;
                height: 0;
                opacity: 1;
            }

            to {
                width: 120px;
                height: 120px;
                opacity: 0;
            }
        }

        .mobile-controls-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 110;
            display: none;
        }

        #joystickZone {
            position: absolute;
            bottom: 50px;
            left: 40px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }

        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 69, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px #ff4500;
        }

        .action-btn-group {
            position: absolute;
            bottom: 40px;
            right: 30px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            pointer-events: auto;
        }

        .mob-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(50, 50, 50, 0.9);
            border: 2px solid #fff;
            color: #fff;
            font-weight: bold;
            font-size: 1.2em;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
        }

        .mob-btn:active {
            background: #ff4500;
            transform: scale(0.9);
        }

        #btnAttack {
            width: 90px;
            height: 90px;
            background: rgba(200, 0, 0, 0.7);
            border-color: #ff4500;
            font-size: 2em;
        }

        #btnLoot {
            background: rgba(0, 191, 255, 0.7);
            border-color: #00bfff;
            font-size: 1.5em;
        }

        .small-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 5px;
        }

        #btnInventory,
        #btnDogs,
        #btnMap {
            width: 50px;
            height: 50px;
            font-size: 0.8em;
            background: #333;
        }
    </style>
</head>

<body>
    <div id="bloodMoonOverlay"></div>
    <div class="game-wrapper">
        <div id="inventoryPanel" class="inventory-sidebar">
            <div class="inv-header">INVENTORY [Q]</div>
            <div class="inv-list" id="invList"></div>
        </div>

        <div class="hud-top">
            <div class="hud-stat">DAY: <span id="levelDisplay">1</span></div>
            <div class="hud-stat">HP: <span id="hpDisplay">100</span></div>
            <div class="hud-stat">DMG: <span id="dmgDisplay">10</span></div>
            <div class="hud-stat">TIME: <span id="timeDisplay">00:20</span></div>
        </div>

        <div id="topAlertBox"></div>

        <div id="adminPanel">
            <h2>ADMIN CONSOLE</h2>
            <div class="admin-row"><label>Set Day:</label><input type="number" id="admDay" class="admin-input"
                    value="1"></div>
            <div class="admin-row"><label>Set HP:</label><input type="number" id="admHp" class="admin-input"
                    value="100"></div>
            <div class="admin-row"><label>Set DMG:</label><input type="number" id="admDmg" class="admin-input"
                    value="10"></div>
            <div class="admin-row"><label>Speed:</label><input type="number" id="admSpeed" class="admin-input"
                    value="7"></div>
            <hr style="border-color: #00ff00; opacity: 0.3;">
            <div class="admin-row">
                <label>Spawn Dogs:</label><input type="number" id="admDogCount" class="admin-input" value="1" min="1"
                    max="50">
                <button class="admin-btn admin-btn-small" onclick="adminSpawnDogs()">+</button>
            </div>
            <button class="admin-btn" onclick="applyAdminSettings()">APPLY STATS</button>
            <button class="admin-btn admin-danger" onclick="adminKillWolves()">KILL ALL WOLVES</button>
            <button class="admin-btn" onclick="closeAdmin()">CLOSE</button>
        </div>

        <div class="game-stage" id="stage">
            <div id="minimap-container"></div>
            <div id="mapViewport">
                <div id="playerIcon" class="icon">🏃</div>
                <div id="wolvesContainer"></div>
                <div id="companionsContainer"></div>
                <div id="mapItems"></div>
                <div id="fxLayer"></div>
            </div>

            <div id="storyText"></div>

            <div id="dogStatsModal">
                <button class="close-modal-btn" style="color:white; float:right;" onclick="toggleDogStats()">X</button>
                <h2 style="text-align:center; margin-top:0; color:#00bfff;">Companion Pack</h2>
                <div id="dogStatsContent"></div>
            </div>

            <div class="mobile-controls-layer" id="mobileLayer">
                <div id="joystickZone">
                    <div id="joystickKnob"></div>
                </div>
                <div class="action-btn-group">
                    <div class="small-btn-group">
                        <div class="mob-btn" id="btnMap" ontouchstart="toggleMinimap()">👁️</div>
                        <div class="mob-btn" id="btnDogs" ontouchstart="toggleDogStats()">🐕</div>
                        <div class="mob-btn" id="btnInventory" ontouchstart="toggleInventory()">INV</div>
                    </div>
                    <div class="mob-btn" id="btnLoot" ontouchstart="tryLoot()">👋</div>
                    <div class="mob-btn" id="btnAttack" ontouchstart="playerAttack()">⚔️</div>
                </div>
            </div>
        </div>
    </div>

    <div id="gameOverOverlay">
        <h1 id="endTitle" style="color:white; font-size:3em;">GAME OVER</h1>
        <h2 id="daysSurvivedText" style="color: #ffaa00;"></h2>
        <div id="newRecordMsg" style="color:#0f0; margin-bottom:10px;"></div>
        <p id="endReason" style="color:#aaa; font-size:1.5em; margin-bottom: 30px;"></p>
        <div id="lossButtons" style="display: none;">
            <button onclick="resetGame()" class="overlay-btn">Restart (Day 1)</button>
            <button onclick="exitGame()" class="overlay-btn" style="background:#555;">Main Menu</button>
        </div>
        <div id="winButtons" style="display: none;">
            <button onclick="nextLevel()" class="overlay-btn" style="background:#4CAF50">Next Day</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let PLAYER_SPEED = 7;
        const WOLF_SPEED = 5.0; // Synced with server
        const DOG_SPEED = 6.0;
        const MAP_SIZE = 1500;
        let currentLevel = 1;
        let player = { x: 750, y: 750, invulnerable: false };
        let camera = { x: 0, y: 0 };
        let wolves = [], companions = [], items = [], chests = [];
        let keyStates = {};
        let gameState = 'collection';
        let timeLeft = 25;
        let hp = 100, maxHp = 100, dmg = 10;
        let isMobile = false;
        let joyActive = false;
        let joyData = { x: 0, y: 0 };
        const joyBase = document.getElementById('joystickZone');
        const joyKnob = document.getElementById('joystickKnob');
        let mobileTapCount = 0;
        let mobileTapTimer = null;
        let lastTime = 0;
        let gameLoopId = null;
        let timerLoopId = null;

        function init() {
            socket = io();
            const u = localStorage.getItem('gameUsername') || "Guest";
            const p = localStorage.getItem('gamePass') || "";

            socket.on('connect', () => { socket.emit('verifyIdentity', { username: u, password: p }); });
            socket.on('authResult', (res) => {
                if (!res.success) { alert(res.msg); window.location.href = 'gamestart.html'; }
                else {
                    startLevel(1);
                    if (!gameLoopId) gameLoopId = requestAnimationFrame(gameLoop);
                    if (!timerLoopId) timerLoopId = setInterval(timerLoop, 1000);
                }
            });

            window.addEventListener('keydown', handleDown);
            window.addEventListener('keyup', handleUp);
            // Glitch Prevention: Reset keys if window loses focus
            window.addEventListener('blur', () => { keyStates = {}; });

            initJoystick();
            isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
            document.getElementById('mobileLayer').style.display = isMobile ? 'block' : 'none';

            document.addEventListener('touchstart', (e) => {
                if (e.target.classList.contains('mob-btn') || e.target.closest('#joystickZone')) return;
                mobileTapCount++;
                if (mobileTapTimer) clearTimeout(mobileTapTimer);
                mobileTapTimer = setTimeout(() => { mobileTapCount = 0; }, 2000);
            });
        }

        function gameLoop(timestamp) {
            gameLoopId = requestAnimationFrame(gameLoop); // Keep loop alive
            if (gameState === 'over') return;

            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            const timeScale = Math.min(dt * 30, 2); // Cap lag spikes

            let dx = 0, dy = 0;
            if (keyStates['w']) dy--; if (keyStates['s']) dy++;
            if (keyStates['a']) dx--; if (keyStates['d']) dx++;
            if (joyActive) { dx = joyData.x; dy = joyData.y; }

            if (dx || dy) {
                const len = Math.sqrt(dx * dx + dy * dy);
                const speedMod = joyActive ? len : 1;
                if (len > 0) {
                    player.x += (dx / len) * PLAYER_SPEED * speedMod * timeScale;
                    player.y += (dy / len) * PLAYER_SPEED * speedMod * timeScale;
                }
            }
            player.x = Math.max(20, Math.min(MAP_SIZE - 20, player.x));
            player.y = Math.max(20, Math.min(MAP_SIZE - 20, player.y));

            updateIcon('playerIcon', player);
            updateCamera();
            updateMinimap();
            handleCompanionAI(timeScale);

            if (gameState === 'chase') {
                wolves.forEach(wolf => {
                    if (wolf.hp <= 0) { document.getElementById(`wolf-${wolf.id}`).style.display = 'none'; return; }
                    const el = document.getElementById(`wolf-${wolf.id}`);
                    el.style.display = 'flex';
                    const angle = Math.atan2(player.y - wolf.y, player.x - wolf.x);
                    wolf.x += Math.cos(angle) * WOLF_SPEED * timeScale;
                    wolf.y += Math.sin(angle) * WOLF_SPEED * timeScale;
                    el.style.left = wolf.x + 'px'; el.style.top = wolf.y + 'px';

                    if (Math.hypot(player.x - wolf.x, player.y - wolf.y) < 40 && !player.invulnerable) {
                        hp -= wolf.dmg; triggerHit(wolf.dmg);
                        if (hp <= 0) triggerGameOver(false, "The pack was too fast.");
                    }
                });
            }
            updateHUD();
        }

        function handleDown(e) {
            const k = e.key.toLowerCase();
            const map = { 'w': 'w', 'a': 'a', 's': 's', 'd': 'd', 'arrowup': 'w', 'arrowleft': 'a', 'arrowdown': 's', 'arrowright': 'd' };
            if (map[k]) keyStates[map[k]] = true;
            if (e.shiftKey && k === 'a') { document.getElementById('adminPanel').style.display = 'block'; showAlert("ADMIN MODE", "#00ff00"); updateAdminInputValues(); }
            if (k === 'e') tryLoot();
            if (k === ' ') playerAttack();
            if (k === 'q') toggleInventory();
            if (k === 'o') toggleDogStats();
            if (k === 'm') toggleMinimap();
            if (k >= '1' && k <= '9') useItem(parseInt(k) - 1);
        }

        function handleUp(e) {
            const k = e.key.toLowerCase();
            const map = { 'w': 'w', 'a': 'a', 's': 's', 'd': 'd', 'arrowup': 'w', 'arrowleft': 'a', 'arrowdown': 's', 'arrowright': 'd' };
            if (map[k]) keyStates[map[k]] = false;
        }

        function startLevel(lvl) {
            currentLevel = lvl;
            gameState = 'collection';
            timeLeft = 25;
            document.getElementById('bloodMoonOverlay').style.opacity = 0;
            player.x = 750; player.y = 750;
            keyStates = {}; joyActive = false; joyData = { x: 0, y: 0 };
            if (joyKnob) joyKnob.style.transform = `translate(-50%, -50%)`;

            companions.forEach(dog => {
                dog.level++; dog.maxHp += 20; dog.hp = Math.min(dog.maxHp, dog.hp + 50); dog.dmg += 5;
                dog.x = player.x; dog.y = player.y;
            });

            document.getElementById('gameOverOverlay').style.display = 'none';
            document.getElementById('lossButtons').style.display = 'none';
            document.getElementById('winButtons').style.display = 'none';
            document.getElementById('dogStatsModal').style.display = 'none';

            spawnChests(lvl);
            spawnWolves(lvl);
            renderCompanions();
            updateHUD();

            if (lvl === 1) { showAlert("DAY 1: THE WOODS", "white"); msg("Find chests quickly."); }
            else { showAlert(`DAY ${lvl}: THE PACK GROWS`, "#00bfff"); }
        }

        function spawnWolves(level) {
            wolves = [];
            const container = document.getElementById('wolvesContainer');
            container.innerHTML = '';
            let count = (level === 1) ? 1 : Math.min(level + 1, 50);
            const wolfHP = level * 80 + 50;
            const wolfDMG = level * 5 + 5;
            for (let i = 0; i < count; i++) {
                let wx = Math.random() > 0.5 ? -100 : MAP_SIZE + 100;
                let wy = Math.random() * MAP_SIZE;
                wolves.push({ id: i, x: wx, y: wy, hp: wolfHP, maxHp: wolfHP, dmg: wolfDMG });
                const el = document.createElement('div');
                el.className = 'wolf-entity'; el.id = `wolf-${i}`; el.style.display = 'none';
                el.innerHTML = `<div class="bar-container"><div class="bar-fill" id="wolf-hp-${i}" style="width: 100%; background:red;"></div></div>🐺`;
                container.appendChild(el);
            }
        }

        function spawnChests(level) {
            chests = [];
            for (let i = 0; i < 12; i++) {
                chests.push({ x: Math.random() * (MAP_SIZE - 100) + 50, y: Math.random() * (MAP_SIZE - 100) + 50, opened: false, reward: generateReward(level) });
            }
            drawChests();
        }

        function generateReward(level) {
            const rand = Math.random() * 100;
            let badChance = Math.max(10, 50 - (level * 2));
            if (rand < badChance) {
                return [{ name: "Cursed Blade", type: "curse_dmg", val: -5, icon: "💀" }, { name: "Blood Debt", type: "hp_half", val: 0.5, icon: "🩸" }, { name: "Rotten Meat", type: "hp_loss", val: -25, icon: "🥩" }][Math.floor(Math.random() * 3)];
            } else if (rand < badChance + 15) {
                return { name: "Summon Dog", type: "potion", icon: "🐕" };
            } else {
                return [{ name: "Steel Sword", type: "sword", val: 12, icon: "⚔️" }, { name: "Health Kit", type: "hp", val: 40, icon: "🍷" }, { name: "Plate Armor", type: "shield", val: 60, icon: "🛡️" }][Math.floor(Math.random() * 3)];
            }
        }

        function drawChests() {
            const container = document.getElementById('mapItems'); container.innerHTML = '';
            chests.forEach((c, i) => {
                if (c.opened) return;
                const el = document.createElement('div'); el.className = 'icon chest'; el.innerText = '📦'; el.id = `chest-${i}`; el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
                container.appendChild(el);
            });
        }

        function updateCamera() {
            const stage = document.getElementById('stage');
            const viewport = document.getElementById('mapViewport');
            camera.x = (stage.clientWidth / 2) - player.x;
            camera.y = (stage.clientHeight / 2) - player.y;
            camera.x = Math.min(0, Math.max(camera.x, stage.clientWidth - MAP_SIZE));
            camera.y = Math.min(0, Math.max(camera.y, stage.clientHeight - MAP_SIZE));
            viewport.style.transform = `translate3d(${camera.x}px, ${camera.y}px, 0)`;
        }

        function updateMinimap() {
            const mm = document.getElementById('minimap-container');
            if (mm.style.display === 'none') return;
            const scale = mm.clientWidth / MAP_SIZE;
            mm.innerHTML = '';
            const pDot = document.createElement('div'); pDot.className = 'mm-dot mm-player'; pDot.style.left = (player.x * scale) + 'px'; pDot.style.top = (player.y * scale) + 'px'; mm.appendChild(pDot);
            chests.forEach(c => { if (!c.opened) { const d = document.createElement('div'); d.className = 'mm-dot mm-chest'; d.style.left = (c.x * scale) + 'px'; d.style.top = (c.y * scale) + 'px'; mm.appendChild(d); } });
            wolves.forEach(w => { if (w.hp > 0 && gameState === 'chase') { const d = document.createElement('div'); d.className = 'mm-dot mm-wolf'; d.style.left = (w.x * scale) + 'px'; d.style.top = (w.y * scale) + 'px'; mm.appendChild(d); } });
            companions.forEach(d => { const dt = document.createElement('div'); dt.className = 'mm-dot mm-dog'; dt.style.left = (d.x * scale) + 'px'; dt.style.top = (d.y * scale) + 'px'; mm.appendChild(dt); });
        }

        function handleCompanionAI(timeScale) {
            const livingWolves = wolves.filter(w => w.hp > 0);
            companions.forEach((dog, i) => {
                if (dog.hp <= 0) return;
                let target = (gameState === 'chase' && livingWolves.length > 0) ? livingWolves[i % livingWolves.length] : player;
                const angle = Math.atan2(target.y - dog.y, target.x - dog.x);
                const dist = Math.hypot(target.x - dog.x, target.y - dog.y);
                if (target === player) {
                    if (dist > 60) { dog.x += Math.cos(angle) * (DOG_SPEED + 1) * timeScale; dog.y += Math.sin(angle) * (DOG_SPEED + 1) * timeScale; }
                } else {
                    if (dist > 30) { dog.x += Math.cos(angle) * DOG_SPEED * timeScale; dog.y += Math.sin(angle) * DOG_SPEED * timeScale; }
                    if (dist < 50 && Date.now() > (dog.cooldown || 0)) {
                        target.hp -= dog.dmg; dog.cooldown = Date.now() + 800;
                        const wBar = document.getElementById(`wolf-hp-${target.id}`);
                        if (wBar) wBar.style.width = (target.hp / target.maxHp * 100) + '%';
                        if (target.hp <= 0) checkVictory();
                    }
                }
                updateIcon(`comp-${i}`, dog);
            });
        }

        function renderCompanions() {
            const container = document.getElementById('companionsContainer'); container.innerHTML = '';
            companions.forEach((c, i) => {
                const el = document.createElement('div'); el.className = 'friendly-wolf'; el.id = `comp-${i}`;
                el.innerHTML = `<div class="bar-container"><div class="bar-fill" id="dog-hp-${i}" style="width:100%; background:#00ff00;"></div></div>🐕`;
                container.appendChild(el);
            });
        }

        function playerAttack() {
            const fx = document.getElementById('fxLayer');
            const ripple = document.createElement('div'); ripple.className = 'attack-range'; ripple.style.left = player.x + 'px'; ripple.style.top = player.y + 'px'; ripple.style.transform = 'translate(-50%, -50%)'; fx.appendChild(ripple);
            setTimeout(() => ripple.remove(), 300);
            wolves.forEach(w => {
                if (w.hp > 0 && Math.hypot(w.x - player.x, w.y - player.y) < 100) {
                    w.hp -= dmg;
                    const wBar = document.getElementById(`wolf-hp-${w.id}`);
                    if (wBar) wBar.style.width = (w.hp / w.maxHp * 100) + '%';
                    if (w.hp <= 0) checkVictory();
                }
            });
        }

        function checkVictory() { if (wolves.every(w => w.hp <= 0)) triggerGameOver(true, "Wave Defeated"); }
        function triggerHit(val) { player.invulnerable = true; document.getElementById('playerIcon').classList.add('invulnerable'); setTimeout(() => { player.invulnerable = false; document.getElementById('playerIcon').classList.remove('invulnerable'); }, 1000); }
        function showAlert(text, color) { const el = document.getElementById('topAlertBox'); el.innerText = text; el.style.borderColor = color; el.style.color = color; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 2000); }

        function useItem(idx, isAuto = false, itemObj = null) {
            const item = isAuto ? itemObj : items[idx]; if (!item) return;
            if (item.type === 'potion') { companions.push({ x: player.x, y: player.y, hp: 100 + (currentLevel * 10), maxHp: 100 + (currentLevel * 10), dmg: 15 + currentLevel, level: 1 }); renderCompanions(); }
            else if (item.type === 'sword') dmg += item.val; else if (item.type === 'hp') hp = Math.min(maxHp, hp + item.val); else if (item.type === 'shield') { maxHp += item.val; hp += item.val; } else if (item.type === 'curse_dmg') dmg = Math.max(1, dmg + item.val); else if (item.type === 'hp_half') hp = Math.floor(hp * item.val); else if (item.type === 'hp_loss') hp += item.val;
            if (!isAuto) { items.splice(idx, 1); renderInventory(); }
            if (hp <= 0) triggerGameOver(false, "The forest took its toll.");
        }

        function renderInventory() {
            const list = document.getElementById('invList'); list.innerHTML = '';
            items.forEach((item, i) => { const div = document.createElement('div'); div.className = 'inv-item'; div.onclick = () => useItem(i); div.innerHTML = `<span class="key-hint">${i + 1}</span> <div>${item.icon} ${item.name}</div>`; list.appendChild(div); });
        }

        function toggleDogStats() {
            const modal = document.getElementById('dogStatsModal'); modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
            const content = document.getElementById('dogStatsContent'); content.innerHTML = companions.length ? '' : '<div style="text-align:center; padding:20px;">No dogs active.</div>';
            companions.forEach((dog, i) => { content.innerHTML += `<div class="dog-stat-row"><span>Dog ${i + 1}</span><span>HP: ${Math.floor(dog.hp)}</span></div>`; });
        }
        function toggleMinimap() { const mm = document.getElementById('minimap-container'); mm.style.display = (mm.style.display === 'none') ? 'block' : 'none'; }
        function tryLoot() {
            chests.forEach((c, i) => {
                if (!c.opened && Math.hypot(player.x - c.x, player.y - c.y) < 60) {
                    c.opened = true; document.getElementById(`chest-${i}`).remove();
                    if (c.reward.type.includes('curse') || c.reward.type.includes('hp_loss') || c.reward.type.includes('hp_half')) { useItem(0, true, c.reward); showAlert(`TRAP: ${c.reward.name} Applied!`, "red"); }
                    else { items.push(c.reward); renderInventory(); showAlert("LOOT FOUND", "yellow"); }
                }
            });
        }
        function toggleInventory() { const panel = document.getElementById('inventoryPanel'); const wasVisible = panel.classList.contains('visible'); panel.classList.toggle('visible'); if (wasVisible && mobileTapCount >= 5) { document.getElementById('adminPanel').style.display = 'block'; showAlert("ADMIN MODE", "#00ff00"); updateAdminInputValues(); mobileTapCount = 0; } }

        function updateAdminInputValues() { document.getElementById('admDay').value = currentLevel; document.getElementById('admHp').value = hp; document.getElementById('admDmg').value = dmg; document.getElementById('admSpeed').value = PLAYER_SPEED; }
        function applyAdminSettings() { currentLevel = parseInt(document.getElementById('admDay').value); hp = parseInt(document.getElementById('admHp').value); dmg = parseInt(document.getElementById('admDmg').value); PLAYER_SPEED = parseInt(document.getElementById('admSpeed').value); showAlert("STATS UPDATED", "#00ff00"); }
        function adminSpawnDogs() { const count = parseInt(document.getElementById('admDogCount').value) || 1; for (let i = 0; i < count; i++) { companions.push({ x: player.x, y: player.y, hp: 150 + (currentLevel * 20), maxHp: 150 + (currentLevel * 20), dmg: 15 + (currentLevel * 2), level: 1, cooldown: 0 }); } renderCompanions(); showAlert(`${count} DOGS SPAWNED`, "#00bfff"); }
        function adminKillWolves() { wolves.forEach(w => { w.hp = 0; const wBar = document.getElementById(`wolf-hp-${w.id}`); if (wBar) wBar.style.width = '0%'; }); checkVictory(); showAlert("ALL WOLVES ELIMINATED", "#ff0000"); }
        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

        function timerLoop() {
            if (gameState !== 'collection') return;
            timeLeft--;
            if (timeLeft <= 0) { gameState = 'chase'; document.getElementById('bloodMoonOverlay').style.opacity = 0.4; showAlert("RUN!", "red"); }
        }
        function updateHUD() { document.getElementById('hpDisplay').innerText = Math.floor(hp) + '/' + maxHp; document.getElementById('dmgDisplay').innerText = dmg; document.getElementById('levelDisplay').innerText = currentLevel; document.getElementById('timeDisplay').innerText = gameState === 'collection' ? timeLeft + 's' : 'HUNT'; }
        function updateIcon(id, obj) { const el = document.getElementById(id); if (el) { el.style.left = obj.x + 'px'; el.style.top = obj.y + 'px'; } }
        function msg(txt) { const t = document.getElementById('storyText'); t.innerText = txt; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 3000); }

        function triggerGameOver(win, reason) {
            gameState = 'over';
            document.getElementById('gameOverOverlay').style.display = 'flex';
            document.getElementById('endTitle').innerText = win ? "VICTORY" : "DEFEAT";
            document.getElementById('endReason').innerText = reason;
            document.getElementById(win ? 'winButtons' : 'lossButtons').style.display = 'block';
            document.getElementById('daysSurvivedText').innerText = `Day ${currentLevel}`;

            // LOCAL PB LOGIC
            const oldBest = parseInt(localStorage.getItem('feral_personalBest') || "0");
            if (currentLevel > oldBest) {
                localStorage.setItem('feral_personalBest', currentLevel);
                document.getElementById('newRecordMsg').innerText = "NEW PERSONAL BEST!";
            }

            const user = localStorage.getItem('gameUsername') || "Guest";
            socket.emit('reportScore', { username: user, days: currentLevel });
        }
        function nextLevel() { startLevel(currentLevel + 1); }
        function resetGame() { currentLevel = 1; hp = 100; maxHp = 100; dmg = 10; companions = []; items = []; startLevel(1); }
        function exitGame() { window.location.href = 'gameintro.html'; }
        function initJoystick() { joyBase.addEventListener('touchstart', (e) => { joyActive = true; updateJoy(e.touches[0]); }, { passive: false }); joyBase.addEventListener('touchmove', (e) => { if (joyActive) { e.preventDefault(); updateJoy(e.touches[0]); } }, { passive: false }); joyBase.addEventListener('touchend', () => { joyActive = false; joyData = { x: 0, y: 0 }; joyKnob.style.transform = `translate(-50%, -50%)`; }); }
        function updateJoy(touch) { const rect = joyBase.getBoundingClientRect(); let dx = touch.clientX - (rect.left + rect.width / 2); let dy = touch.clientY - (rect.top + rect.height / 2); const dist = Math.sqrt(dx * dx + dy * dy); const maxDist = rect.width / 2; if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; } joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; joyData.x = dx / maxDist; joyData.y = dy / maxDist; }

        init();
    </script>
</body>
