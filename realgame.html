<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feral Pursuit - Survival</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vt323&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            user-select: none;
        }

        #gameStage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* SCARY MAP & VISUALS */
        #mapLayer {
            width: 1500px;
            height: 1500px;
            position: absolute;
            background-color: #0b1a0b;
            /* Grass Pattern */
            background-image: radial-gradient(#1a2e1a 15%, transparent 16%), radial-gradient(#1a2e1a 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            border: 10px solid #111;
            image-rendering: pixelated;
        }

        .tree {
            position: absolute;
            font-size: 40px;
            color: #004400;
            text-shadow: 2px 2px 0 #000;
            z-index: 5;
            pointer-events: none;
        }

        /* ENTITIES */
        .entity {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 10;
        }

        /* PLAYER - Pixel Mario Style */
        .player {
            width: 32px;
            height: 32px;
            background: #ff4500;
            box-shadow: 4px 0 #fff, -4px 0 #fff, 0 -4px #fff, 0 4px #fff;
            /* Pixel border */
            image-rendering: pixelated;
            z-index: 20;
        }

        /* SCARY WOLF */
        .wolf {
            font-size: 40px;
            color: #000;
            text-shadow: 0 0 5px red;
            filter: drop-shadow(0 0 10px red);
            z-index: 15;
            transition: transform 0.1s linear;
        }

        .white-wolf {
            font-size: 60px;
            color: #fff;
            text-shadow: 0 0 15px #fff;
            filter: drop-shadow(0 0 20px blue);
        }

        /* CHEST & ITEMS */
        .chest {
            font-size: 30px;
            z-index: 9;
            filter: drop-shadow(0 5px 5px black);
        }

        /* UI */
        .hud {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #555;
            padding: 10px 20px;
            font-size: 1.5em;
            z-index: 100;
            display: flex;
            gap: 20px;
            border-radius: 5px;
        }

        .hud span {
            color: #ffaa00;
        }

        /* ADMIN PANEL - Scrollable & Full Features */
        #adminPanel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            background: rgba(0, 20, 0, 0.95);
            border: 2px solid #0f0;
            padding: 20px;
            z-index: 200;
            display: none;
            box-shadow: 0 0 30px #0f0;
            color: #0f0;
        }

        .adm-grp {
            margin-bottom: 15px;
            border-bottom: 1px dashed #005500;
            padding-bottom: 10px;
        }

        .adm-btn {
            background: #003300;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px 10px;
            cursor: pointer;
            margin: 2px;
            font-family: inherit;
            font-size: 1em;
            width: 100%;
        }

        .adm-btn:hover {
            background: #0f0;
            color: #000;
        }

        .adm-inp {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            width: 60px;
            text-align: center;
        }

        /* BLOOD MOON & SCARES */
        #bloodOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(200, 0, 0, 0.4) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s;
            z-index: 50;
        }

        .jumpscare {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }

        /* INVENTORY SIDEBAR */
        #invPanel {
            position: fixed;
            left: -250px;
            top: 0;
            width: 250px;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            border-right: 2px solid #555;
            transition: left 0.3s;
            z-index: 90;
            padding: 20px;
            box-sizing: border-box;
        }

        #invPanel.open {
            left: 0;
        }

        /* MOBILE JOYSTICK */
        #joyZone {
            position: fixed;
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            z-index: 150;
        }

        #joyKnob {
            width: 50px;
            height: 50px;
            background: rgba(255, 69, 0, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <audio id="sfx-step" src="assets/footstep.mp3"></audio>
    <audio id="sfx-scary" src="assets/jumpscare.mp3"></audio>
    <audio id="sfx-wolf" src="assets/wolf_growl.mp3"></audio>
    <audio id="bgm-theme" src="assets/scary_theme.mp3" loop></audio>

    <div id="bloodOverlay"></div>

    <div class="hud">
        DAY: <span id="dayDisp">1</span> | HP: <span id="hpDisp">100</span> | <span id="timeDisp">25s</span>
    </div>

    <div id="invPanel">
        <h2 style="border-bottom:1px solid #555; color:#ff4500;">BACKPACK [Q]</h2>
        <div id="invList"></div>
    </div>

    <div id="adminPanel">
        <h2 style="text-align:center; border-bottom:2px solid #0f0;">COMMAND TERMINAL</h2>

        <div class="adm-grp">
            <h3>LOCAL CONTROL</h3>
            <button class="adm-btn" onclick="admCmd('killWolves')">KILL ALL WOLVES</button>
            <div style="display:flex;">
                <input class="adm-inp" id="aHp" placeholder="HP"> <button class="adm-btn" onclick="admCmd('setHp')">SET
                    HP</button>
            </div>
            <div style="display:flex;">
                <input class="adm-inp" id="aDmg" placeholder="DMG"> <button class="adm-btn"
                    onclick="admCmd('setDmg')">SET DMG</button>
            </div>
            <button class="adm-btn" onclick="admCmd('spawnDogs')">SPAWN DOGS (5)</button>
            <button class="adm-btn" onclick="admCmd('spawnItem', 'potion')">GIVE POTION</button>
            <button class="adm-btn" onclick="admCmd('spawnItem', 'sword')">GIVE SWORD</button>
        </div>

        <div class="adm-grp" style="border-color:#ff0000;">
            <h3 style="color:#ff0000;">GLOBAL OVERRIDE (ALL PLAYERS)</h3>
            <button class="adm-btn" style="border-color:red; color:red;" onclick="admGlobal('globalKill')">NUKE WOLVES
                (GLOBAL)</button>
            <button class="adm-btn" style="border-color:cyan; color:cyan;" onclick="admGlobal('spawnWhiteWolf')">SPAWN
                WHITE WOLF (BOSS)</button>
            <button class="adm-btn" style="border-color:gold; color:gold;" onclick="admGlobal('giveGlobalCoins')">GIFT
                100 COINS ALL</button>
            <input id="gChat" style="width:100%; background:#200; color:white;"
                placeholder="Global Broadcast Message...">
            <button class="adm-btn" onclick="admGlobal('broadcast')">SEND ALERT</button>
        </div>

        <button class="adm-btn" onclick="document.getElementById('adminPanel').style.display='none'">CLOSE
            TERMINAL</button>
    </div>

    <div id="gameStage">
        <div id="mapLayer">
            <div id="entities"></div>
        </div>
    </div>

    <div id="joyZone">
        <div id="joyKnob"></div>
    </div>
    <div style="position:fixed; bottom:30px; right:30px; display:flex; gap:10px; z-index:150;" id="mobControls">
        <button class="adm-btn" style="width:60px; height:60px; border-radius:50%; font-size:20px;"
            onclick="attack()">⚔️</button>
        <button class="adm-btn" style="width:50px; height:50px; border-radius:50%; font-size:20px;"
            onclick="loot()">👋</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const username = localStorage.getItem('gameUsername');
        if (!username) window.location.href = 'auth.html';

        // --- GAME VARIABLES ---
        const MAP_SIZE = 1500;
        let player = { x: 750, y: 750, hp: 100, maxHp: 100, dmg: 10, speed: 7, invuln: false };
        let items = [], wolves = [], chests = [], trees = [];
        let keys = {};
        let day = 1;
        let state = 'scavenge'; // 'scavenge' or 'hunt'
        let timer = 25;
        let isAdmin = false;

        // --- SETUP ---
        const mapEl = document.getElementById('mapLayer');
        const entEl = document.getElementById('entities');

        function init() {
            // Generate Trees for atmosphere
            for (let i = 0; i < 40; i++) {
                const t = document.createElement('div'); t.className = 'tree';
                t.innerText = Math.random() > 0.5 ? '🌲' : '🌳';
                t.style.left = Math.random() * 1400 + 'px'; t.style.top = Math.random() * 1400 + 'px';
                mapEl.appendChild(t);
            }

            // Check Admin
            if (username.toLowerCase() === 'beka_ei') isAdmin = true;

            // Load Shop Items
            socket.emit('getUserData', username);
            socket.on('userData', data => {
                if (data.classes.includes('starter')) player.dmg += 2;
                if (data.classes.includes('medic')) items.push({ name: 'Elixir', type: 'hp', val: 50, icon: '🍷' });
                renderInv();
            });

            // Joystick
            if (/Android|iPhone/i.test(navigator.userAgent)) {
                document.getElementById('joyZone').style.display = 'block';
                // (Joystick logic same as before, abbreviated here for length)
            } else {
                document.getElementById('mobControls').style.display = 'none';
            }

            spawnLevel(1);
            requestAnimationFrame(loop);
            setInterval(gameTimer, 1000);

            // BGM
            document.body.click(); // Trigger audio unlock
            document.getElementById('bgm-theme').volume = 0.3;
            document.getElementById('bgm-theme').play().catch(() => { });
        }

        // --- GAME LOOP ---
        function loop() {
            // Movement
            let dx = 0, dy = 0;
            if (keys['w']) dy--; if (keys['s']) dy++;
            if (keys['a']) dx--; if (keys['d']) dx++;

            if (dx || dy) {
                player.x += dx * player.speed; player.y += dy * player.speed;
                // Play Step Sound occasionally
                if (Math.random() < 0.1) document.getElementById('sfx-step').play().catch(() => { });
            }

            // Camera
            const cx = window.innerWidth / 2 - player.x;
            const cy = window.innerHeight / 2 - player.y;
            mapEl.style.transform = `translate(${cx}px, ${cy}px)`;

            // Render Player
            renderEnt('p1', player.x, player.y, '<div class="player"></div>');

            // Wolf Logic
            if (state === 'hunt') {
                wolves.forEach((w, i) => {
                    if (w.hp <= 0) return;
                    // Chase
                    const angle = Math.atan2(player.y - w.y, player.x - w.x);
                    w.x += Math.cos(angle) * (w.isWhite ? 3 : 5); // White wolf slower but tanky
                    w.y += Math.sin(angle) * (w.isWhite ? 3 : 5);

                    let html = w.isWhite ? '🐺' : '🐺';
                    let cls = w.isWhite ? 'entity white-wolf' : 'entity wolf';

                    renderEnt('w' + i, w.x, w.y, html, cls);

                    // Attack
                    if (Math.hypot(player.x - w.x, player.y - w.y) < 40 && !player.invuln) {
                        player.hp -= w.dmg;
                        document.getElementById('hpDisp').innerText = player.hp;
                        document.body.classList.add('jumpscare');
                        setTimeout(() => document.body.classList.remove('jumpscare'), 500);
                        document.getElementById('sfx-scary').play();
                        player.invuln = true; setTimeout(() => player.invuln = false, 1000);
                        if (player.hp <= 0) gameOver();
                    }
                });
            }

            requestAnimationFrame(loop);
        }

        function spawnLevel(lvl) {
            day = lvl; document.getElementById('dayDisp').innerText = lvl;
            state = 'scavenge'; timer = 25;
            document.getElementById('bloodOverlay').style.opacity = 0;

            wolves = [];
            const wolfCount = lvl + 2;
            for (let i = 0; i < wolfCount; i++) wolves.push({ x: -100, y: -100, hp: 50 + (lvl * 20), dmg: 5 + lvl, isWhite: false });

            chests = [];
            for (let i = 0; i < 10; i++) chests.push({ x: Math.random() * 1400, y: Math.random() * 1400, opened: false });
            renderChests();
        }

        function gameTimer() {
            if (state === 'scavenge') {
                timer--;
                document.getElementById('timeDisp').innerText = timer + 's';
                if (timer <= 0) {
                    state = 'hunt';
                    document.getElementById('timeDisp').innerText = "HUNT!";
                    document.getElementById('bloodOverlay').style.opacity = 1;
                    document.getElementById('sfx-wolf').play();
                    // Spawn wolves at random edges
                    wolves.forEach(w => {
                        w.x = Math.random() > 0.5 ? player.x + 600 : player.x - 600;
                        w.y = player.y + (Math.random() * 600 - 300);
                    });
                }
            } else if (state === 'hunt') {
                if (wolves.every(w => w.hp <= 0)) {
                    socket.emit('reportScore', { username, days: day }); // Save Record
                    spawnLevel(day + 1);
                    socket.emit('giveCoins', { username, amount: 1 }); // Earn coin per day
                }
            }
        }

        // --- ACTIONS ---
        function attack() {
            wolves.forEach((w, i) => {
                if (w.hp > 0 && Math.hypot(w.x - player.x, w.y - player.y) < 100) {
                    w.hp -= player.dmg;
                    if (w.hp <= 0) {
                        document.getElementById('ent-w' + i).remove();
                        if (w.isWhite) { day += 50; socket.emit('alert', { msg: "WHITE WOLF SLAIN! +50 DAYS", color: "gold" }); }
                    }
                }
            });
        }

        function loot() {
            chests.forEach((c, i) => {
                if (!c.opened && Math.hypot(c.x - player.x, c.y - player.y) < 60) {
                    c.opened = true;
                    document.getElementById('ent-c' + i).remove();
                    // Simple Loot Table
                    const r = Math.random();
                    if (r < 0.3) { items.push({ name: 'Potion', type: 'hp', val: 30, icon: '🍷' }); }
                    else if (r < 0.6) { player.dmg += 2; alert("Found Sharp Stone (+2 DMG)"); }
                    else { alert("Empty..."); }
                    renderInv();
                }
            });
        }

        // --- ADMIN FUNCTIONS (Req 12, 17) ---
        window.onkeydown = (e) => {
            keys[e.key] = true;
            if (e.key === 'q') document.getElementById('invPanel').classList.toggle('open');
            // Shift + A for Admin
            if (e.key === 'A' && isAdmin) document.getElementById('adminPanel').style.display = 'block';
        };
        window.onkeyup = (e) => keys[e.key] = false;

        function admCmd(action, param) {
            if (action === 'killWolves') wolves.forEach(w => w.hp = 0);
            if (action === 'setHp') player.hp = parseInt(document.getElementById('aHp').value);
            if (action === 'setDmg') player.dmg = parseInt(document.getElementById('aDmg').value);
            if (action === 'spawnDogs') alert("Dogs spawned (visual only in SP)");
            if (action === 'spawnItem') items.push({ name: 'Admin Gift', type: param, val: 100, icon: 'qa' });
            renderInv();
        }

        function admGlobal(action) {
            const val = action === 'broadcast' ? document.getElementById('gChat').value : null;
            socket.emit('adminGlobal', { action, val, username });
        }

        // Listen for Global Admin Events
        socket.on('globalEvent', (data) => {
            if (data.type === 'kill') wolves.forEach(w => w.hp = 0);
            if (data.type === 'whiteWolf') {
                wolves.push({ x: player.x + 300, y: player.y, hp: 15000, dmg: 1000, isWhite: true });
                alert("THE WHITE WOLF HAS APPEARED!");
            }
            if (data.type === 'msg') alert("ADMIN BROADCAST: " + data.msg);
        });

        // --- HELPERS ---
        function renderEnt(id, x, y, html, cls = 'entity') {
            let el = document.getElementById('ent-' + id);
            if (!el) {
                el = document.createElement('div'); el.id = 'ent-' + id; el.className = cls;
                entEl.appendChild(el);
            }
            el.innerHTML = html; el.style.left = x + 'px'; el.style.top = y + 'px';
        }
        function renderChests() {
            chests.forEach((c, i) => renderEnt('c' + i, c.x, c.y, '📦', 'entity chest'));
        }
        function renderInv() {
            const l = document.getElementById('invList'); l.innerHTML = '';
            items.forEach((it, i) => {
                l.innerHTML += `<div onclick="useItem(${i})" style="padding:10px; border-bottom:1px solid #333; cursor:pointer;">${it.icon} ${it.name}</div>`;
            });
        }
        function useItem(i) {
            const it = items[i];
            if (it.type === 'hp') player.hp += it.val;
            items.splice(i, 1); renderInv(); document.getElementById('hpDisp').innerText = player.hp;
        }
        function gameOver() {
            alert("YOU DIED. SURVIVED: " + day);
            window.location.href = 'gameintro.html';
        }

        init();
    </script>
</body>

</html>
