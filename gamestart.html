<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Pursuit</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            border: 1px solid #333;
            padding: 40px;
            background: rgba(10, 10, 10, 0.9);
            width: 300px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0f0;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>IDENTITY</h1>
        <input type="text" id="username" placeholder="CODENAME" oninput="check()">
        <div id="passSection" style="display:none;">
            <input type="password" id="password" placeholder="ADMIN PASS KEY">
        </div>
        <button onclick="start()">CONNECT</button>
        <p id="msg" style="color:red; margin-top:10px;"></p>
    </div>
    <script>
        function check() {
            const val = document.getElementById('username').value.trim();
            // UPDATED USERNAME CHECK
            document.getElementById('passSection').style.display = (val.toLowerCase() === 'bereketisthebest') ? 'block' : 'none';
        }
        function start() {
            const user = document.getElementById('username').value.trim();
            if (!user) return document.getElementById('msg').innerText = "REQUIRED";
            localStorage.setItem('gameUsername', user);
            localStorage.setItem('gamePass', document.getElementById('password').value);
            window.location.href = 'realgame.html';
        }
    </script>
</body>

</html>
