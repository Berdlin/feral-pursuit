<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Feral Pursuit - Briefing</title>
    <style>
        /* ... use your existing CSS ... */
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        .record-box {
            margin: 20px auto;
            background: #111;
            padding: 15px;
            width: fit-content;
            border: 1px solid #333;
        }

        .val {
            font-size: 1.5em;
            font-weight: bold;
            color: gold;
        }
    </style>
</head>

<body>
    <h1>FERAL PURSUIT</h1>

    <div class="record-box">
        <div>YOUR BEST: <span id="pbDisplay" class="val">--</span></div>
        <br>
        <div>WORLD RECORD: <span id="wrDisplay" class="val">LOADING...</span></div>
        <div style="font-size:0.8em">HELD BY: <span id="wrHolder">--</span></div>
    </div>

    <div style="margin-top: 30px;">
        <a href="gamestart.html"><button style="padding:15px;">SINGLE PLAYER</button></a>
        <a href="gamelobby.html"><button style="padding:15px;">MULTIPLAYER</button></a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="chat_overlay.js"></script>
    <script>
        // Init Local Data
        document.getElementById('pbDisplay').innerText = "DAY " + (localStorage.getItem('feral_personalBest') || "0");

        // Fetch Global Data
        const socket = io();
        socket.on('connect', () => { socket.emit('getLeaderboard'); });
        socket.on('leaderboardData', (data) => {
            document.getElementById('wrDisplay').innerText = `DAY ${data.days}`;
            document.getElementById('wrHolder').innerText = data.holder.toUpperCase();
        });
    </script>
</body>

</html>
