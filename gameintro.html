<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Pursuit - Briefing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vt323&display=swap');

        body {
            margin: 0;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'VT323', monospace;
            font-size: 1.2em;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 95%;
            text-align: center;
            padding: 20px;
            border: 2px solid #500;
            background: rgba(0, 0, 0, 0.95);
            box-shadow: 0 0 50px rgba(100, 0, 0, 0.3);
        }

        h1 {
            font-size: 4em;
            color: #ff4500;
            margin: 0;
            text-shadow: 4px 4px 0px #300;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            background: #111;
            padding: 15px;
            border: 1px solid #333;
        }

        .val {
            font-size: 2em;
            color: gold;
        }

        .lbl {
            color: #888;
            font-size: 0.8em;
        }

        .shop-section {
            border-top: 2px dashed #444;
            margin-top: 20px;
            padding-top: 20px;
        }

        .shop-item {
            display: inline-block;
            width: 40%;
            background: #222;
            margin: 10px;
            padding: 10px;
            border: 1px solid #444;
            cursor: pointer;
            transition: 0.3s;
        }

        .shop-item:hover {
            border-color: gold;
            background: #333;
        }

        .shop-item.owned {
            border-color: #0f0;
            opacity: 0.5;
            cursor: default;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin: 10px;
            background: #500;
            color: #fff;
            text-decoration: none;
            font-size: 1.5em;
            border: 2px solid #f00;
            cursor: pointer;
        }

        .btn:hover {
            background: #f00;
            color: #000;
        }

        .btn-multi {
            background: #003366;
            border-color: #00bfff;
        }

        .btn-multi:hover {
            background: #00bfff;
        }
    </style>
</head>

<body>
    <audio id="bgm" loop>
        <source src="assets/scary_theme.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>FERAL PURSUIT</h1>
        <div style="color:#aaa; margin-bottom: 20px;">OPERATOR: <span id="userDisplay"
                style="color:white; font-weight:bold;">--</span></div>

        <div class="stat-grid">
            <div>
                <div class="val" id="coinDisplay">0</div>
                <div class="lbl">FERAL COINS</div>
            </div>
            <div>
                <div class="val" id="pbDisplay">0</div>
                <div class="lbl">BEST SURVIVAL</div>
            </div>
            <div>
                <div class="val" id="wrDisplay">--</div>
                <div class="lbl">WORLD RECORD</div>
            </div>
        </div>

        <div class="shop-section">
            <h2 style="margin:0; color:gold;">SUPPLY DEPOT</h2>
            <div class="shop-item" onclick="buyClass('starter', 5)" id="item-starter">
                <div style="font-size:2em;">⚔️ STARTER</div>
                <div style="color:#aaa;">Spawn with Sword (+2 DMG)</div>
                <div style="color:gold;">COST: 5 COINS</div>
            </div>
            <div class="shop-item" onclick="buyClass('medic', 10)" id="item-medic">
                <div style="font-size:2em;">💊 MEDIC</div>
                <div style="color:#aaa;">Spawn with Health Elixir</div>
                <div style="color:gold;">COST: 10 COINS</div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <a href="realgame.html" class="btn">SINGLE PLAYER</a>
            <a href="gamelobby.html" class="btn btn-multi">MULTIPLAYER LOBBY</a>
            <br>
            <a href="auth.html" style="color:#555; font-size:0.8em; margin-top:10px; display:inline-block;">LOGOUT</a>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const user = localStorage.getItem('gameUsername');
        if (!user) window.location.href = 'auth.html';

        document.getElementById('userDisplay').innerText = user.toUpperCase();

        // Music attempt
        document.body.addEventListener('click', () => { document.getElementById('bgm').play().catch(e => { }); }, { once: true });

        socket.on('connect', () => {
            socket.emit('getUserData', user);
        });

        socket.on('userData', (data) => {
            document.getElementById('coinDisplay').innerText = data.coins;
            document.getElementById('pbDisplay').innerText = `DAY ${data.highScore}`;
            document.getElementById('wrDisplay').innerText = `DAY ${data.wr} (${data.wrHolder})`;

            if (data.classes.includes('starter')) document.getElementById('item-starter').classList.add('owned');
            if (data.classes.includes('medic')) document.getElementById('item-medic').classList.add('owned');
        });

        function buyClass(type, cost) {
            socket.emit('buyItem', { username: user, item: type, cost: cost });
        }
    </script>
</body>

</html>
