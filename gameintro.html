<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Pursuit - Briefing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 900px;
            width: 90%;
            text-align: center;
            padding: 30px;
            border: 1px solid #500;
            background: rgba(0, 0, 0, 0.95);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #ff4500;
            font-size: 3em;
            text-shadow: 0 0 10px red;
            margin-bottom: 10px;
        }

        .coin-display {
            font-size: 1.5em;
            color: #ffd700;
            margin-bottom: 20px;
            font-weight: bold;
            font-family: 'Cinzel';
            border: 1px solid gold;
            padding: 10px;
            display: inline-block;
        }

        .record-box {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: #080808;
            padding: 15px;
            border: 1px solid #333;
        }

        .val {
            font-size: 1.5em;
            font-weight: bold;
            color: gold;
        }

        .label {
            font-size: 0.7em;
            color: #888;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin: 10px;
            background: #300;
            color: #fff;
            text-decoration: none;
            border: 1px solid #ff4500;
            font-family: 'Cinzel';
            transition: 0.3s;
            cursor: pointer;
        }

        .btn:hover {
            background: #ff4500;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>FERAL PURSUIT</h1>

        <div class="coin-display">
            🪙 FERAL COINS: <span id="coinVal">0</span>
        </div>

        <div class="record-box">
            <div class="stat">
                <div class="val" id="pbDisplay">--</div>
                <div class="label">YOUR BEST SURVIVAL</div>
            </div>
            <div class="stat">
                <div class="val" id="wrDisplay">LOADING...</div>
                <div class="label">WORLD RECORD</div>
            </div>
            <div class="stat">
                <div class="val" id="wrHolder">--</div>
                <div class="label">HELD BY</div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <a href="gamestart.html" class="btn">SINGLE PLAYER</a>
            <a href="gamelobby.html" class="btn" style="background: #002233; border-color: #00bfff;">MULTIPLAYER
                LOBBY</a>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        window.onload = function () {
            const myBest = localStorage.getItem('feral_personalBest') || "0";
            const myCoins = localStorage.getItem('feral_coins') || "0";
            document.getElementById('pbDisplay').innerText = `DAY ${myBest}`;
            document.getElementById('coinVal').innerText = myCoins;
        };
        socket.on('connect', () => { socket.emit('getLeaderboard'); });
        socket.on('leaderboardData', (data) => {
            document.getElementById('wrDisplay').innerText = `DAY ${data.days}`;
            document.getElementById('wrHolder').innerText = data.holder.toUpperCase();
        });
    </script>
</body>

</html>
