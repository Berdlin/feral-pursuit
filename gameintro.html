<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Feral Pursuit - Hub</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            border: 1px solid #333;
            padding: 20px;
            background: #050505;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #222;
            padding: 10px;
            margin: 20px 0;
        }

        .coin {
            color: gold;
            font-weight: bold;
        }

        .shop-item {
            border: 1px solid #555;
            padding: 10px;
            margin: 10px;
            display: inline-block;
            width: 200px;
        }

        .btn {
            background: #a00;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            cursor: pointer;
            border: none;
        }

        .owned {
            background: green;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 style="color:red; text-shadow: 0 0 10px red;">FERAL PURSUIT</h1>
        <h3>Welcome, <span id="uName">Hunter</span></h3>

        <div class="stats">
            <div>COINS: <span id="uCoins" class="coin">0</span> 🪙</div>
            <div>CLASS: <select id="classSelect">
                    <option value="default">Civilian</option>
                </select></div>
        </div>

        <h2>BLACK MARKET</h2>
        <div id="shop">
            <div class="shop-item">
                <h4>STARTER KIT</h4>
                <p>Start with +5 DMG</p>
                <button class="btn" id="btn-starter" onclick="buy('starter', 5)">BUY (5 Coins)</button>
            </div>
            <div class="shop-item">
                <h4>FIELD MEDIC</h4>
                <p>Start with +50 HP</p>
                <button class="btn" id="btn-medic" onclick="buy('medic', 10)">BUY (10 Coins)</button>
            </div>
        </div>

        <hr>
        <a href="realgame.html" class="btn">SINGLE PLAYER</a>
        <a href="multiplay.html" class="btn" style="background: #0044aa;">MULTIPLAYER</a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const user = JSON.parse(localStorage.getItem('fp_user'));
        if (!user) window.location.href = 'auth.html';

        document.getElementById('uName').innerText = user.username;
        document.getElementById('uCoins').innerText = user.coins;
        updateClasses();

        function buy(cls, cost) {
            socket.emit('buyClass', { username: user.username, className: cls, cost: cost });
        }

        socket.on('purchaseSuccess', (data) => {
            user.coins = data.coins;
            user.classes = data.classes;
            localStorage.setItem('fp_user', JSON.stringify(user));
            document.getElementById('uCoins').innerText = user.coins;
            updateClasses();
            alert("Equip your new class in the dropdown!");
        });

        function updateClasses() {
            const sel = document.getElementById('classSelect');
            sel.innerHTML = '<option value="default">Civilian</option>';
            user.classes.forEach(c => {
                sel.innerHTML += `<option value="${c}">${c.toUpperCase()}</option>`;
                const btn = document.getElementById(`btn-${c}`);
                if (btn) { btn.innerText = "OWNED"; btn.classList.add('owned'); }
            });
            sel.onchange = () => localStorage.setItem('fp_class', sel.value);
        }
    </script>
</body>

</html>
