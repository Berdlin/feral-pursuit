<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vt323&display=swap');

        body {
            background: #111;
            color: #eee;
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #222;
            padding: 40px;
            border: 2px solid #444;
            text-align: center;
            width: 300px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.5em;
            font-family: inherit;
            cursor: pointer;
            border: none;
            color: white;
        }

        .btn-host {
            background: #ff4500;
        }

        .btn-join {
            background: #00bfff;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 1.5em;
            text-align: center;
            font-family: inherit;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1 style="margin:0 0 20px 0;">SQUAD UPLINK</h1>
        <div id="initScreen">
            <button onclick="host()" class="btn btn-host">HOST MISSION</button>
            <div style="margin-top:20px; border-top:1px solid #444; padding-top:20px;">
                <input id="code" placeholder="ENTER 4-DIGIT CODE" maxlength="4">
                <button onclick="join()" class="btn btn-join">JOIN SQUAD</button>
            </div>
            <p id="err" style="color:red;"></p>
        </div>
        <div id="lobbyScreen" style="display:none;">
            <h2>CODE: <span id="dCode" style="color:#0f0;"></span></h2>
            <ul id="pList"
                style="text-align:left; list-style:none; padding:0; border:1px solid #333; min-height:100px;"></ul>
            <button id="startBtn" onclick="start()" class="btn btn-host" style="display:none;">DEPLOY</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const user = localStorage.getItem('gameUsername');
        if (!user) window.location.href = 'auth.html';
        let isHost = false;

        function host() { socket.emit('hostGame', { username: user }); }
        function join() {
            const c = document.getElementById('code').value;
            if (c.length === 4) socket.emit('joinGame', c, { username: user });
            else document.getElementById('err').innerText = "INVALID CODE";
        }
        function start() { if (isHost) socket.emit('startGame'); }

        socket.on('roomCreated', c => { setupLobby(c, true); });
        socket.on('joinSuccess', c => { setupLobby(c, false); });
        socket.on('joinFailed', m => document.getElementById('err').innerText = m);

        function setupLobby(code, hostStatus) {
            isHost = hostStatus;
            localStorage.setItem('gameRoomCode', code);
            document.getElementById('initScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'block';
            document.getElementById('dCode').innerText = code;
            if (isHost) document.getElementById('startBtn').style.display = 'block';
        }

        socket.on('lobbyUpdate', list => {
            const ul = document.getElementById('pList'); ul.innerHTML = '';
            list.forEach(p => { ul.innerHTML += `<li style="padding:5px; border-bottom:1px solid #333;">➤ ${p}</li>`; });
        });
        socket.on('gameStarted', () => window.location.href = 'multiplay.html');
    </script>
</body>

</html>
