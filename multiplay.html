<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Pursuit</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        #gameStage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mapLayer {
            width: 1500px;
            height: 1500px;
            position: absolute;
            background: #111;
            background-image: linear-gradient(#222 1px, transparent 1px), linear-gradient(90deg, #222 1px, transparent 1px);
            background-size: 50px 50px;
            border: 5px solid #333;
        }

        .entity {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: all 0.1s linear;
        }

        /* PLAYER */
        .player {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 10;
            box-shadow: 0 0 10px white;
        }

        .name-tag {
            position: absolute;
            top: -25px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 12px;
            white-space: nowrap;
        }

        /* WOLVES & ITEMS */
        .wolf {
            width: 50px;
            height: 50px;
            background: #500;
            border-radius: 50%;
            border: 2px solid red;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chest {
            font-size: 30px;
            z-index: 4;
        }

        /* OBSTACLES */
        .obstacle {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .tree {
            background: #003300;
            border: 2px solid #00ff00;
            color: #00ff00;
        }

        .rock {
            background: #333;
            border: 2px solid #777;
            color: #777;
        }

        /* ATTACK ANIMATION */
        .attack-ripple {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ripple 0.3s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes ripple {
            from {
                width: 0;
                height: 0;
                opacity: 1;
            }

            to {
                width: 140px;
                height: 140px;
                opacity: 0;
            }
        }

        /* UI */
        #hud {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            color: white;
            border-radius: 20px;
            z-index: 100;
            font-weight: bold;
            border: 1px solid #444;
        }

        #alert {
            position: fixed;
            top: 60px;
            width: 100%;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 0 0 10px black;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.5s;
            opacity: 0;
        }
    </style>
</head>

<body>
    <div id="alert"></div>
    <div id="hud">HP: <span id="hpDisp">100</span> | CLASS: <span id="classDisp">-</span></div>

    <div id="gameStage">
        <div id="mapLayer">
            <div id="groundObjects"></div>
            <div id="entities"></div>
            <div id="fxLayer"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const myUser = localStorage.getItem('gameUsername');
        const myPass = localStorage.getItem('gamePass');
        const myClass = localStorage.getItem('gameClass') || 'scout';
        let myId = null;

        // --- SOUND SYSTEM ---
        // Instructions: Upload files named 'step.mp3', 'attack.mp3', 'howl.mp3' to your public folder
        const sounds = {
            step: new Audio(), // Placeholder
            attack: new Audio(),
            howl: new Audio()
        };
        function playSound(name) {
            // Uncomment below if you upload files
            // if(sounds[name]) { sounds[name].currentTime = 0; sounds[name].play().catch(e=>{}); }
        }

        // --- MOVEMENT VARS ---
        let keyState = {};
        let myPos = { x: 750, y: 750 };
        let players = {};

        // --- CONNECT ---
        socket.on('connect', () => {
            myId = socket.id;
            socket.emit('verifyIdentity', { username: myUser, password: myPass });
            const code = localStorage.getItem('gameRoomCode');
            if (code) socket.emit('joinGame', code, { username: myUser, classType: myClass });
        });

        // --- INPUT HANDLING (WASD + ARROWS) ---
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            // Arrow keys mapping
            if (k === 'w' || k === 'arrowup') keyState['w'] = true;
            if (k === 'a' || k === 'arrowleft') keyState['a'] = true;
            if (k === 's' || k === 'arrowdown') keyState['s'] = true;
            if (k === 'd' || k === 'arrowright') keyState['d'] = true;

            if (e.key === ' ' || k === 'enter') {
                socket.emit('playerAction', { type: 'attack' });
                showAttackVisual(myPos.x, myPos.y); // Instant local feedback
                playSound('attack');
            }
            if (k === 'e') socket.emit('playerAction', { type: 'loot' });
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') keyState['w'] = false;
            if (k === 'a' || k === 'arrowleft') keyState['a'] = false;
            if (k === 's' || k === 'arrowdown') keyState['s'] = false;
            if (k === 'd' || k === 'arrowright') keyState['d'] = false;
        });

        // --- GAME LOOP ---
        function loop() {
            // Local Prediction Movement
            let dx = 0, dy = 0;
            if (keyState['w']) dy = -1;
            if (keyState['s']) dy = 1;
            if (keyState['a']) dx = -1;
            if (keyState['d']) dx = 1;

            if (dx !== 0 || dy !== 0) {
                socket.emit('playerMove', { dx, dy });
                // We trust the server for position to avoid desync with obstacles, 
                // but we could predict here if needed. For now, rely on server update for "Tank/Scout" speeds.
            }

            updateCamera();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        // --- RENDER ---
        socket.on('gameStateUpdate', (s) => {
            // 1. Render Obstacles (Static)
            const ground = document.getElementById('groundObjects');
            if (ground.innerHTML === '') {
                s.obstacles.forEach(o => {
                    const d = document.createElement('div');
                    d.className = `obstacle ${o.type}`;
                    d.style.width = (o.r * 2) + 'px'; d.style.height = (o.r * 2) + 'px';
                    d.style.left = o.x + 'px'; d.style.top = o.y + 'px';
                    d.innerText = o.type === 'tree' ? '🌲' : '🪨';
                    ground.appendChild(d);
                });
            }

            // 2. Render Entities
            const entLayer = document.getElementById('entities');
            entLayer.innerHTML = ''; // Clear frame

            // Players
            for (const pid in s.players) {
                const p = s.players[pid];
                if (!p.alive) continue;

                // Interpolate for smoothness
                if (pid === myId) {
                    myPos.x = p.x; myPos.y = p.y; // Sync local
                    document.getElementById('hpDisp').innerText = Math.floor(p.hp);
                    document.getElementById('classDisp').innerText = p.classType.toUpperCase();
                }

                const el = document.createElement('div');
                el.className = 'entity player';
                el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
                el.style.background = p.classType === 'medic' ? '#0ff' : (p.classType === 'tank' ? '#444' : '#f00');
                el.innerHTML = `<div class="name-tag">${p.username}</div>👤`;
                entLayer.appendChild(el);
            }

            // Wolves
            s.wolves.forEach(w => {
                if (w.hp <= 0) return;
                const el = document.createElement('div');
                el.className = 'entity wolf';
                el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
                el.innerText = '🐺';
                entLayer.appendChild(el);
            });

            // Chests
            s.chests.forEach(c => {
                if (!c.opened) {
                    const el = document.createElement('div'); el.className = 'entity chest';
                    el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
                    el.innerText = '📦';
                    entLayer.appendChild(el);
                }
            });
        });

        socket.on('fx', (data) => {
            if (data.type === 'attack') showAttackVisual(data.x, data.y);
            if (data.type === 'blood') { /* Add blood particle logic here if desired */ }
        });

        socket.on('alert', (d) => {
            const a = document.getElementById('alert');
            a.innerText = d.msg; a.style.color = d.color; a.style.opacity = 1;
            setTimeout(() => a.style.opacity = 0, 2000);
        });

        function showAttackVisual(x, y) {
            const layer = document.getElementById('fxLayer');
            const d = document.createElement('div');
            d.className = 'attack-ripple';
            d.style.left = x + 'px'; d.style.top = y + 'px';
            layer.appendChild(d);
            setTimeout(() => d.remove(), 400);
        }

        function updateCamera() {
            const stage = document.getElementById('gameStage');
            const map = document.getElementById('mapLayer');
            let cx = (stage.clientWidth / 2) - myPos.x;
            let cy = (stage.clientHeight / 2) - myPos.y;

            // Boundary clamping
            cx = Math.min(0, Math.max(cx, stage.clientWidth - 1500));
            cy = Math.min(0, Math.max(cy, stage.clientHeight - 1500));

            map.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
        }
    </script>
</body>

</html>
