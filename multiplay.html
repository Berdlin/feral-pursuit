<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feral Pursuit - Multiplayer</title>
    <style>
        /* CORE GAME STYLES (MATCHING SINGLEPLAYER) */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #080808;
            color: #ccc;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            touch-action: none;
            user-select: none;
        }

        .game-stage {
            flex-grow: 1;
            position: relative;
            background: #050805;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mapViewport {
            width: 1500px;
            height: 1500px;
            background: #0c180f;
            border: 5px solid #222;
            position: absolute;
            transform-origin: 0 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
        }

        /* ENTITIES */
        .icon {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: left 0.1s linear, top 0.1s linear;
        }

        .player-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 0 10px white;
        }

        .player-name {
            position: absolute;
            top: -20px;
            font-size: 12px;
            white-space: nowrap;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* WOLF STYLES (Synced with Real Game) */
        .wolf-entity {
            font-size: 2.5em;
            width: 50px;
            height: 50px;
            background: #200;
            border-radius: 50%;
            border: 2px solid #f00;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px #f00;
        }

        .white-wolf-entity {
            font-size: 4em;
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            border: 3px solid #ccc;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px #fff;
        }

        .chest {
            font-size: 24px;
            cursor: pointer;
        }

        .bar-container {
            width: 100%;
            height: 4px;
            background: #555;
            margin-bottom: 2px;
            position: absolute;
            top: -10px;
        }

        .bar-fill {
            height: 100%;
            background: lime;
            transition: width 0.2s;
        }

        /* HUD */
        .hud-top {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            z-index: 100;
            display: flex;
            gap: 20px;
        }

        .hud-stat span {
            color: #ff4500;
            font-weight: bold;
        }

        #topAlert {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            transition: opacity 0.5s;
            opacity: 0;
            z-index: 100;
            text-shadow: 0 0 10px black;
        }

        /* ADMIN PANEL (Multiplayer Version) */
        #adminPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ff00;
            padding: 20px;
            z-index: 300;
            display: none;
            color: #00ff00;
            font-family: monospace;
            box-shadow: 0 0 20px #00ff00;
        }

        .admin-row {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-input {
            width: 60px;
            background: #222;
            border: 1px solid currentColor;
            color: #fff;
            padding: 5px;
            text-align: center;
        }

        .admin-btn {
            width: 100%;
            background: #003300;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        /* MOBILE CONTROLS */
        #mobileControls {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 500;
            pointer-events: none;
        }

        .mob-zone {
            position: absolute;
            pointer-events: auto;
        }

        #joystick {
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        #joyKnob {
            width: 50px;
            height: 50px;
            background: #ff4500;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #btnAttack {
            bottom: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.5);
            border: 2px solid red;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        #btnLoot {
            bottom: 150px;
            right: 50px;
            width: 60px;
            height: 60px;
            background: rgba(0, 191, 255, 0.5);
            border: 2px solid cyan;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>

<body>

    <div class="hud-top">
        <div class="hud-stat">DAY: <span id="dayDisplay">1</span></div>
        <div class="hud-stat">HP: <span id="hpDisplay">100</span></div>
        <div class="hud-stat">ALIVE: <span id="aliveDisplay">0</span></div>
        <div class="hud-stat">TIME: <span id="timeDisplay">25</span></div>
    </div>
    <div id="topAlert"></div>

    <div id="adminPanel">
        <h2>MULTIPLAYER ADMIN</h2>
        <div class="admin-row"><label>Set HP:</label><input type="number" id="admHp" class="admin-input" value="100">
        </div>
        <div class="admin-row"><label>Set DMG:</label><input type="number" id="admDmg" class="admin-input" value="10">
        </div>
        <div class="admin-row"><label>Speed:</label><input type="number" id="admSpeed" class="admin-input" value="7">
        </div>
        <div class="admin-row"><label>Level:</label><input type="number" id="admLevel" class="admin-input" value="1">
        </div>
        <button class="admin-btn" onclick="applyAdminStats()">APPLY STATS</button>
        <button class="admin-btn" onclick="spawnWhiteWolf()">SPAWN WHITE WOLF</button>
        <button class="admin-btn" style="background:#500; border-color:red;" onclick="killAllWolves()">KILL ALL
            WOLVES</button>
        <button class="admin-btn" onclick="document.getElementById('adminPanel').style.display='none'">CLOSE</button>
    </div>

    <div class="game-stage">
        <div id="mapViewport">
            <div id="entitiesLayer"></div>
        </div>
    </div>

    <div id="mobileControls">
        <div id="joystick" class="mob-zone">
            <div id="joyKnob"></div>
        </div>
        <div id="btnAttack" class="mob-zone" onclick="emitAttack()">⚔️</div>
        <div id="btnLoot" class="mob-zone" onclick="emitLoot()">👋</div>
    </div>

    <div style="position:fixed; top:10px; left:10px; z-index:200;">
        <button id="btnVoice" onclick="joinVoiceChat()"
            style="background:#00bfff; border:none; padding:5px; font-weight:bold;">Enable Voice</button>
        <div id="voiceStatus" style="color:#0f0; font-size:10px;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="chat_overlay.js"></script>
    <script>
        const socket = io();
        const user = localStorage.getItem('gameUsername') || "Guest";
        const pass = localStorage.getItem('gamePass') || "";
        let isAdmin = false;
        let myId = null;
        let gameState = { players: {}, wolves: [], chests: [] };
        let camera = { x: 0, y: 0 };
        const MAP_SIZE = 1500;

        // Inputs
        const keys = {};
        let joyData = { x: 0, y: 0, active: false };

        socket.on('connect', () => {
            myId = socket.id;
            socket.emit('verifyIdentity', { username: user, password: pass });
        });

        socket.on('authResult', (res) => {
            isAdmin = res.isAdmin;
            if (isAdmin) {
                const al = document.getElementById('topAlert');
                al.innerText = "ADMIN ACCESS GRANTED (SHIFT+A)";
                al.style.color = "#0f0"; al.style.opacity = 1;
                setTimeout(() => al.style.opacity = 0, 3000);
            }
        });

        socket.on('gameStarted', () => {
            document.getElementById('topAlert').innerText = "CONNECTION ESTABLISHED";
            document.getElementById('topAlert').style.opacity = 1;
            setTimeout(() => document.getElementById('topAlert').style.opacity = 0, 2000);
            renderLoop();
        });

        function renderLoop() {
            requestAnimationFrame(renderLoop);

            // Inputs
            let dx = 0, dy = 0;
            if (keys['w'] || keys['ArrowUp']) dy -= 1;
            if (keys['s'] || keys['ArrowDown']) dy += 1;
            if (keys['a'] || keys['ArrowLeft']) dx -= 1;
            if (keys['d'] || keys['ArrowRight']) dx += 1;
            if (joyData.active) { dx = joyData.x; dy = joyData.y; }
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len > 0) { dx /= len; dy /= len; }
            if (dx !== 0 || dy !== 0) socket.emit('playerInput', { dx: dx, dy: dy });

            // Camera
            const myPlayer = gameState.players[myId];
            if (myPlayer) {
                const stageW = window.innerWidth;
                const stageH = window.innerHeight;
                camera.x = (stageW / 2) - myPlayer.x;
                camera.y = (stageH / 2) - myPlayer.y;
                camera.x = Math.min(0, Math.max(camera.x, stageW - MAP_SIZE));
                camera.y = Math.min(0, Math.max(camera.y, stageH - MAP_SIZE));
                document.getElementById('mapViewport').style.transform = `translate(${camera.x}px, ${camera.y}px)`;
                document.getElementById('hpDisplay').innerText = Math.floor(myPlayer.hp);
            }

            renderEntities();
        }

        function renderEntities() {
            const layer = document.getElementById('entitiesLayer');
            layer.innerHTML = '';

            gameState.chests.forEach((c, i) => {
                if (!c.opened) {
                    const el = document.createElement('div'); el.className = 'icon chest'; el.innerText = '📦';
                    el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
                    layer.appendChild(el);
                }
            });

            gameState.wolves.forEach(w => {
                if (w.hp > 0) {
                    const el = document.createElement('div');
                    el.className = 'icon ' + (w.isWhite ? 'white-wolf-entity' : 'wolf-entity');
                    el.innerHTML = '🐺';
                    el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
                    const bar = document.createElement('div');
                    bar.className = 'bar-container';
                    const fill = document.createElement('div');
                    fill.className = 'bar-fill';
                    fill.style.width = (w.hp / w.maxHp * 100) + '%';
                    fill.style.background = w.isWhite ? 'white' : 'red';
                    bar.appendChild(fill); el.appendChild(bar);
                    layer.appendChild(el);
                }
            });

            let aliveCount = 0;
            Object.values(gameState.players).forEach(p => {
                if (p.alive) aliveCount++;
                const isMe = p.id === myId;
                const el = document.createElement('div');
                el.className = 'icon player-dot';
                el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
                el.style.backgroundColor = isMe ? '#ff4500' : '#00bfff';
                el.style.opacity = p.alive ? 1 : 0.3;
                el.innerText = '🏃';
                const name = document.createElement('div');
                name.className = 'player-name'; name.innerText = p.username;
                el.appendChild(name);
                layer.appendChild(el);
            });
            document.getElementById('aliveDisplay').innerText = aliveCount;
        }

        socket.on('gameStateUpdate', (state) => {
            gameState = state;
            document.getElementById('dayDisplay').innerText = state.day;
            document.getElementById('timeDisplay').innerText = state.timer > 0 ? state.timer : "HUNT";
        });
        socket.on('alert', (data) => {
            const al = document.getElementById('topAlert');
            al.innerText = data.msg; al.style.color = data.color; al.style.opacity = 1;
            setTimeout(() => al.style.opacity = 0, 3000);
        });
        socket.on('gameOver', (data) => {
            alert(`GAME OVER\nReason: ${data.reason}\nSurvived: ${data.days} Days`);
            window.location.href = 'gamelobby.html';
        });
        socket.on('notification', (data) => {
            const al = document.getElementById('topAlert');
            al.innerText = data.msg; al.style.color = data.color; al.style.opacity = 1;
            setTimeout(() => al.style.opacity = 0, 2000);
        });

        // Controls
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'Enter') emitAttack();
            if (e.key.toLowerCase() === 'e') emitLoot();
            // Admin Panel
            if (e.shiftKey && e.key.toLowerCase() === 'a' && isAdmin) {
                document.getElementById('adminPanel').style.display = 'block';
            }
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function emitAttack() { socket.emit('playerAttack'); }
        function emitLoot() { socket.emit('tryLoot'); }

        // Admin Functions
        function applyAdminStats() {
            const hp = parseInt(document.getElementById('admHp').value);
            const dmg = parseInt(document.getElementById('admDmg').value);
            const speed = parseInt(document.getElementById('admSpeed').value);
            const level = parseInt(document.getElementById('admLevel').value);
            socket.emit('adminAction', { type: 'setStats', hp, dmg, speed, level });
        }
        function killAllWolves() { socket.emit('adminAction', { type: 'killWolves' }); }
        function spawnWhiteWolf() { socket.emit('adminAction', { type: 'spawnWhiteWolf' }); }

        // Mobile
        const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isMobile) {
            document.getElementById('mobileControls').style.display = 'block';
            const joy = document.getElementById('joystick');
            const knob = document.getElementById('joyKnob');
            joy.addEventListener('touchstart', (e) => { joyData.active = true; handleJoy(e); }, { passive: false });
            joy.addEventListener('touchmove', (e) => { e.preventDefault(); handleJoy(e); }, { passive: false });
            joy.addEventListener('touchend', () => { joyData.active = false; joyData.x = 0; joyData.y = 0; knob.style.transform = `translate(-50%, -50%)`; });
            function handleJoy(e) {
                const rect = joy.getBoundingClientRect();
                const touch = e.touches[0];
                let x = touch.clientX - (rect.left + rect.width / 2);
                let y = touch.clientY - (rect.top + rect.height / 2);
                const max = 60;
                const dist = Math.sqrt(x * x + y * y);
                if (dist > max) { x = (x / dist) * max; y = (y / dist) * max; }
                knob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                joyData.x = x / max; joyData.y = y / max;
            }
        }

        // Voice (Simplified)
        let localStream;
        async function joinVoiceChat() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('btnVoice').style.display = 'none';
                document.getElementById('voiceStatus').innerText = "VOICE ON";
                // Signal to server (reuse joinGame as trigger for peers)
                socket.emit('joinGame', localStorage.getItem('gameRoomCode'), { username: user });
            } catch (e) { alert("Mic Error"); }
        }
    </script>
</body>

</html>
