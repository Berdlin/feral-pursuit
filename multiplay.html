<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feral Pursuit - Multiplayer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #080808;
            color: #ccc;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* --- GAME WORLD --- */
        .game-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
        }

        .game-stage {
            flex-grow: 1;
            position: relative;
            background-color: #050805;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mapViewport {
            width: 1500px;
            height: 1500px;
            background-color: #0c180f;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            border: 5px solid #222;
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        /* --- UI ELEMENTS --- */
        .hud-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 150;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #333;
        }

        .hud-stat span {
            color: #ff4500;
            font-weight: bold;
        }

        #bossHud {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            display: none;
            z-index: 155;
            text-align: center;
        }

        .boss-bar-frame {
            width: 100%;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        .boss-bar-fill {
            height: 100%;
            background: #fff;
            width: 100%;
            transition: width 0.2s;
            box-shadow: 0 0 10px white;
        }

        .boss-label {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 5px black;
            margin-bottom: 5px;
        }

        /* --- ENTITIES --- */
        .entity {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-icon {
            font-size: 1.5em;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #fff;
            z-index: 10;
            background: #333;
        }

        .wolf-entity {
            font-size: 2em;
            width: 40px;
            height: 40px;
            background: #200;
            border-radius: 50%;
            border: 2px solid #f00;
            z-index: 9;
            box-shadow: 0 0 10px #f00;
        }

        .white-wolf-entity {
            font-size: 3em;
            width: 70px;
            height: 70px;
            background: #fff;
            border-radius: 50%;
            border: 3px solid #ccc;
            z-index: 15;
            box-shadow: 0 0 25px #fff;
        }

        .chest {
            font-size: 1.8em;
            z-index: 8;
        }

        .name-tag {
            position: absolute;
            top: -25px;
            color: white;
            font-size: 0.8em;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 4px;
            border-radius: 3px;
        }

        /* --- CHAT BOX --- */
        #chatContainer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 250px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            z-index: 200;
        }

        #chatMessages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.9em;
            color: #ddd;
        }

        #chatInputRow {
            display: flex;
            border-top: 1px solid #444;
        }

        #chatInput {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            outline: none;
        }

        #chatSendBtn {
            background: #333;
            color: white;
            border: none;
            padding: 0 15px;
            cursor: pointer;
        }

        /* --- VOICE CONTROLS --- */
        #voiceControls {
            position: absolute;
            bottom: 280px;
            left: 20px;
            z-index: 200;
            display: flex;
            gap: 10px;
        }

        .voice-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mic-on {
            background: #4CAF50;
            color: white;
        }

        .mic-off {
            background: #f44336;
            color: white;
        }

        /* --- ADMIN PANELS --- */
        .admin-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid;
            padding: 20px;
            z-index: 300;
            display: none;
            max-height: 80vh;
            overflow-y: auto;
        }

        .admin-input {
            width: 100%;
            margin-bottom: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 5px;
        }

        .admin-btn {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #globalAdminPanel {
            border-color: #a020f0;
            color: #d080ff;
        }

        #powerPanel {
            border-color: #00ff00;
            color: #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }

        /* --- OVERLAYS --- */
        #topAlertBox {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            z-index: 160;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #inventoryPanel {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 250px;
            background: rgba(20, 20, 20, 0.95);
            border-right: 2px solid #333;
            transform: translateX(-100%);
            transition: transform 0.3s;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }

        #inventoryPanel.visible {
            transform: translateX(0);
        }

        .inv-item {
            background: #333;
            margin: 5px 0;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="bossHud">
        <div class="boss-label">THE WHITE WOLF</div>
        <div class="boss-bar-frame">
            <div class="boss-bar-fill" id="bossBarFill"></div>
        </div>
    </div>

    <div id="topAlertBox"></div>

    <div class="game-wrapper">
        <div class="hud-top">
            <div class="hud-stat">DAY: <span id="dayDisplay">1</span></div>
            <div class="hud-stat">HP: <span id="hpDisplay">100</span></div>
            <div class="hud-stat">ALIVE: <span id="aliveDisplay">0</span></div>
            <div class="hud-stat">TIME: <span id="timeDisplay">25</span></div>
        </div>

        <div id="inventoryPanel">
            <h2 style="color:#ff4500; text-align:center;">INVENTORY</h2>
            <div id="invList"></div>
        </div>

        <div id="chatContainer">
            <div id="chatMessages"></div>
            <div id="chatInputRow">
                <input type="text" id="chatInput" placeholder="Type message..." maxlength="50">
                <button id="chatSendBtn" onclick="sendChat()">Send</button>
            </div>
        </div>

        <div id="voiceControls">
            <button class="voice-btn mic-off" id="micBtn" onclick="toggleMic()">🎤</button>
            <div style="color: #aaa; font-size: 0.8em; align-self: center;">VOICE</div>
        </div>

        <div class="game-stage" id="stage">
            <div id="mapViewport">
                <div id="entitiesLayer"></div>
                <div id="itemsLayer"></div>
            </div>
        </div>

        <div id="globalAdminPanel" class="admin-panel">
            <h3>GLOBAL ADMIN</h3>
            <input type="text" id="globalMsg" class="admin-input" placeholder="Broadcast Message">
            <button class="admin-btn" style="background:#a020f0; color:white;"
                onclick="globalBroadcast()">BROADCAST</button>
            <button class="admin-btn" style="background:white; color:black;" onclick="spawnGlobalWolf()">SPAWN GLOBAL
                WOLF</button>
            <button class="admin-btn" style="background:#500; color:white;" onclick="killAllServer()">KILL ALL
                (SERVER)</button>
            <button class="admin-btn"
                onclick="document.getElementById('globalAdminPanel').style.display='none'">CLOSE</button>
        </div>

        <div id="powerPanel" class="admin-panel">
            <h3>OPERATOR POWER (Shift+I)</h3>
            <p>Grant yourself special permissions.</p>
            <button class="admin-btn" style="background:#003300; color:#0f0; border:1px solid #0f0;"
                onclick="sendPowerAction('giveOP')">ACTIVATE GOD MODE</button>
            <button class="admin-btn" style="background:#333; color:#fff;"
                onclick="sendPowerAction('spawnWolfLocal')">SPAWN WOLF (HERE)</button>
            <button class="admin-btn"
                onclick="document.getElementById('powerPanel').style.display='none'">CLOSE</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const MAP_SIZE = 1500;

        let myId = null;
        let myPlayer = null;
        let isAdmin = false;

        // Inputs
        const keys = {};

        // Audio
        let localStream = null;
        const peers = {}; // Connection per player

        function init() {
            const u = localStorage.getItem('gameUsername') || "Guest";
            const p = localStorage.getItem('gamePass') || "";

            socket.on('connect', () => {
                myId = socket.id;
                socket.emit('verifyIdentity', { username: u, password: p });
            });

            socket.on('authResult', (res) => {
                if (res.isAdmin) isAdmin = true;
                if (!res.success) { alert(res.msg); window.location.href = 'gamestart.html'; }
                else {
                    const roomCode = localStorage.getItem('gameRoomCode');
                    socket.emit('joinGame', roomCode, { username: u });
                    initVoice(); // Ask for mic permission immediately
                    requestAnimationFrame(gameLoop);
                }
            });

            setupSocketListeners();
            setupInput();
        }

        function setupSocketListeners() {
            // Game State
            socket.on('gameStateUpdate', (state) => {
                renderGame(state);
                updateHUD(state);
                myPlayer = state.players[myId];
            });

            // Chat
            socket.on('chatMessage', (data) => {
                const box = document.getElementById('chatMessages');
                const line = document.createElement('div');
                line.style.color = data.color || (data.user === myPlayer?.username ? '#00bfff' : '#ddd');
                line.innerHTML = `<b>${data.user}:</b> ${data.text}`;
                box.appendChild(line);
                box.scrollTop = box.scrollHeight;
            });

            // Alerts
            socket.on('alert', (data) => showAlert(data.msg, data.color));

            // Boss Bar
            socket.on('bossUpdate', (data) => {
                const hud = document.getElementById('bossHud');
                if (data.active) {
                    hud.style.display = 'block';
                    const pct = (data.hp / data.maxHp) * 100;
                    document.getElementById('bossBarFill').style.width = pct + '%';
                } else {
                    hud.style.display = 'none';
                }
            });

            // Player Death/Victory
            socket.on('gameOver', (data) => {
                alert(`GAME OVER\nReason: ${data.reason}\nDays Survived: ${data.days}`);
                window.location.href = 'gamelobby.html';
            });

            socket.on('playerHit', (data) => {
                if (data.id === myId) {
                    document.body.style.boxShadow = "inset 0 0 50px red";
                    setTimeout(() => document.body.style.boxShadow = "none", 200);
                }
            });

            // Notification
            socket.on('notification', (data) => {
                const div = document.createElement('div');
                div.innerText = data.msg;
                div.style.color = data.color;
                div.style.background = "rgba(0,0,0,0.8)";
                div.style.padding = "5px 10px";
                div.style.marginTop = "5px";
                document.getElementById('topAlertBox').appendChild(div);
                setTimeout(() => div.remove(), 2000);
            });

            // --- WEBRTC SIGNALS ---
            socket.on('all-users', users => {
                users.forEach(userId => createPeer(userId, socket.id, localStream));
            });

            socket.on('voice-signal', data => {
                const peerId = data.callerID;
                const signal = data.signal;
                if (peers[peerId]) {
                    peers[peerId].signal(signal);
                } else {
                    addPeer(signal, peerId, localStream);
                }
            });

            socket.on('user-disconnected', userId => {
                if (peers[userId]) peers[userId].destroy();
                delete peers[userId];
            });
        }

        // --- GAME LOOP & RENDER ---
        function gameLoop() {
            if (myPlayer && myPlayer.alive) {
                let dx = 0, dy = 0;
                if (keys['w'] || keys['ArrowUp']) dy = -1;
                if (keys['s'] || keys['ArrowDown']) dy = 1;
                if (keys['a'] || keys['ArrowLeft']) dx = -1;
                if (keys['d'] || keys['ArrowRight']) dx = 1;

                if (dx !== 0 || dy !== 0) {
                    // Normalize diagonal
                    const len = Math.sqrt(dx * dx + dy * dy);
                    socket.emit('playerMove', { dx: dx / len, dy: dy / len });
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function renderGame(state) {
            const viewport = document.getElementById('mapViewport');
            const entityLayer = document.getElementById('entitiesLayer');
            const itemLayer = document.getElementById('itemsLayer');

            // Center Camera
            if (myPlayer) {
                const cx = (window.innerWidth / 2) - myPlayer.x;
                const cy = (window.innerHeight / 2) - myPlayer.y;
                viewport.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
            }

            entityLayer.innerHTML = '';
            itemLayer.innerHTML = '';

            // Draw Chests
            state.chests.forEach(c => {
                if (!c.opened) {
                    const el = document.createElement('div');
                    el.className = 'entity chest';
                    el.innerText = '📦';
                    el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
                    itemLayer.appendChild(el);
                }
            });

            // Draw Players
            Object.values(state.players).forEach(p => {
                if (!p.alive) return;
                const el = document.createElement('div');
                el.className = 'entity player-icon';
                el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
                el.style.background = p.color;
                el.innerHTML = `<div class="name-tag">${p.username}</div>🏃`;
                entityLayer.appendChild(el);

                // Draw Companions
                if (p.companions) {
                    p.companions.forEach(dog => {
                        const d = document.createElement('div');
                        d.className = 'entity';
                        d.style.left = dog.x + 'px'; d.style.top = dog.y + 'px';
                        d.innerHTML = '🐕';
                        entityLayer.appendChild(d);
                    });
                }
            });

            // Draw Wolves
            state.wolves.forEach(w => {
                if (w.hp > 0) {
                    const el = document.createElement('div');
                    el.className = w.isWhite ? 'entity white-wolf-entity' : 'entity wolf-entity';
                    el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
                    // Simple health bar
                    const hpPct = (w.hp / w.maxHp) * 100;
                    el.innerHTML = `<div style="position:absolute; top:-10px; width:30px; height:4px; background:red;"><div style="width:${hpPct}%; background:#0f0; height:100%;"></div></div>`;
                    entityLayer.appendChild(el);
                }
            });
        }

        function updateHUD(state) {
            const me = state.players[myId];
            if (me) {
                document.getElementById('hpDisplay').innerText = Math.ceil(me.hp) + "/" + me.maxHp;

                // Inventory
                const invDiv = document.getElementById('invList');
                invDiv.innerHTML = '';
                me.inventory.forEach(item => {
                    invDiv.innerHTML += `<div class="inv-item">${item.icon} ${item.name}</div>`;
                });
            }
            document.getElementById('dayDisplay').innerText = state.day;
            document.getElementById('timeDisplay').innerText = state.timer;
            const aliveCount = Object.values(state.players).filter(p => p.alive).length;
            document.getElementById('aliveDisplay').innerText = aliveCount;
        }

        // --- INPUT HANDLING ---
        function setupInput() {
            window.addEventListener('keydown', e => {
                keys[e.key] = true;

                if (document.activeElement === document.getElementById('chatInput')) return;

                if (e.code === 'Space') socket.emit('playerAttack');
                if (e.key.toLowerCase() === 'e') socket.emit('tryLoot');
                if (e.key.toLowerCase() === 'q') toggleInventory();

                // Admin Panels
                if (e.shiftKey && e.key.toLowerCase() === 'g') {
                    if (isAdmin) document.getElementById('globalAdminPanel').style.display = 'block';
                }
                if (e.shiftKey && e.key.toLowerCase() === 'i') {
                    // Power Panel (Shift+I)
                    document.getElementById('powerPanel').style.display = 'block';
                }
            });
            window.addEventListener('keyup', e => keys[e.key] = false);
        }

        function toggleInventory() {
            document.getElementById('inventoryPanel').classList.toggle('visible');
        }

        // --- CHAT SYSTEM ---
        function sendChat() {
            const inp = document.getElementById('chatInput');
            const msg = inp.value.trim();
            if (msg) {
                socket.emit('sendChat', msg);
                inp.value = '';
            }
        }

        // --- ADMIN FUNCTIONS ---
        function globalBroadcast() {
            const msg = document.getElementById('globalMsg').value;
            socket.emit('globalAdminAction', { action: 'broadcast', msg: msg });
        }
        function spawnGlobalWolf() { socket.emit('globalAdminAction', { action: 'spawnWolf' }); }
        function killAllServer() { socket.emit('globalAdminAction', { action: 'killAll' }); }

        function sendPowerAction(type) {
            socket.emit('adminPowerAction', { type: type });
        }

        function showAlert(text, color) {
            const el = document.getElementById('topAlertBox');
            el.innerHTML = `<div style="color:${color}">${text}</div>`;
            el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 3000);
        }

        // --- VOICE CHAT (WebRTC) ---
        function initVoice() {
            navigator.mediaDevices.getUserMedia({ video: false, audio: true })
                .then(stream => {
                    localStream = stream;
                    // Mute by default
                    localStream.getAudioTracks()[0].enabled = false;
                    socket.emit('join-voice');
                })
                .catch(err => console.log("Mic access denied or error:", err));
        }

        function toggleMic() {
            if (!localStream) return;
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            const btn = document.getElementById('micBtn');
            if (track.enabled) {
                btn.className = "voice-btn mic-on";
            } else {
                btn.className = "voice-btn mic-off";
            }
        }

        function createPeer(userToSignal, callerID, stream) {
            const peer = new SimplePeer({ initiator: true, tricke: false, stream: stream });

            peer.on('signal', signal => {
                socket.emit('voice-signal', { target: userToSignal, callerID: callerID, signal: signal });
            });

            peer.on('stream', remoteStream => {
                playAudioStream(remoteStream);
            });

            peers[userToSignal] = peer;
        }

        function addPeer(incomingSignal, callerID, stream) {
            const peer = new SimplePeer({ initiator: false, tricke: false, stream: stream });

            peer.on('signal', signal => {
                socket.emit('voice-signal', { target: callerID, callerID: socket.id, signal: signal });
            });

            peer.on('stream', remoteStream => {
                playAudioStream(remoteStream);
            });

            peer.signal(incomingSignal);
            peers[callerID] = peer;
        }

        function playAudioStream(stream) {
            const audio = document.createElement('audio');
            audio.srcObject = stream;
            audio.play();
        }

        init();
    </script>
</body>

</html>
