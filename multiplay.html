<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feral Pursuit - Multiplayer</title>
    <style>
        /* CORE GAME STYLES (MATCHING SINGLEPLAYER) */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #080808;
            color: #ccc;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            touch-action: none;
            user-select: none;
        }

        .game-stage {
            flex-grow: 1;
            position: relative;
            background: #050805;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mapViewport {
            width: 1500px;
            height: 1500px;
            background: #0c180f;
            border: 5px solid #222;
            position: absolute;
            transform-origin: 0 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
        }

        /* ENTITIES */
        .icon {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: left 0.1s linear, top 0.1s linear;
        }

        .player-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 0 10px white;
        }

        .player-name {
            position: absolute;
            top: -20px;
            font-size: 12px;
            white-space: nowrap;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .wolf {
            width: 50px;
            height: 50px;
            background: #200;
            border: 2px solid red;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 0 15px red;
        }

        .wolf-white {
            width: 80px;
            height: 80px;
            background: white;
            border: 3px solid #ccc;
            color: black;
            font-size: 40px;
            box-shadow: 0 0 25px white;
        }

        .chest {
            font-size: 24px;
            cursor: pointer;
        }

        .bar-container {
            width: 100%;
            height: 4px;
            background: #555;
            margin-bottom: 2px;
        }

        .bar-fill {
            height: 100%;
            background: lime;
            transition: width 0.2s;
        }

        /* HUD */
        .hud-top {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            z-index: 100;
            display: flex;
            gap: 20px;
        }

        .hud-stat span {
            color: #ff4500;
            font-weight: bold;
        }

        #topAlert {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            transition: opacity 0.5s;
            opacity: 0;
            z-index: 100;
            text-shadow: 0 0 10px black;
        }

        /* VOICE CHAT UI */
        #voicePanel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #00bfff;
            z-index: 200;
            border-radius: 5px;
        }

        .voice-btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            cursor: pointer;
            margin-right: 5px;
        }

        .voice-btn.active {
            background: #00bfff;
            color: black;
        }

        .voice-status {
            font-size: 10px;
            color: #aaa;
            margin-top: 5px;
        }

        /* GLOBAL CHATBOX */
        #globalChat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 250px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #ff4500;
            z-index: 999;
            display: flex;
            flex-direction: column;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.2);
            display: none;
        }

        #chatHeader {
            padding: 8px;
            background: #220000;
            color: #ff4500;
            font-weight: bold;
            border-bottom: 1px solid #440000;
            display: flex;
            justify-content: space-between;
        }

        #chatMessages {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
            font-family: monospace;
        }

        #chatInputContainer {
            padding: 5px;
            border-top: 1px solid #333;
            display: flex;
        }

        #chatInput {
            flex-grow: 1;
            background: #111;
            border: none;
            color: white;
            padding: 5px;
            outline: none;
        }

        #chatSend {
            background: #ff4500;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            padding: 0 10px;
        }

        .msg-line {
            margin-bottom: 4px;
            word-wrap: break-word;
        }

        /* MOBILE CONTROLS */
        #mobileControls {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 500;
            pointer-events: none;
        }

        .mob-zone {
            position: absolute;
            pointer-events: auto;
        }

        #joystick {
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        #joyKnob {
            width: 50px;
            height: 50px;
            background: #ff4500;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #btnAttack {
            bottom: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.5);
            border: 2px solid red;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        #btnLoot {
            bottom: 150px;
            right: 50px;
            width: 60px;
            height: 60px;
            background: rgba(0, 191, 255, 0.5);
            border: 2px solid cyan;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        #btnChatMob {
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: #333;
            pointer-events: auto;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid white;
            border-radius: 4px;
        }
    </style>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>

<body>

    <div class="hud-top">
        <div class="hud-stat">DAY: <span id="dayDisplay">1</span></div>
        <div class="hud-stat">HP: <span id="hpDisplay">100</span></div>
        <div class="hud-stat">ALIVE: <span id="aliveDisplay">0</span></div>
        <div class="hud-stat">TIME: <span id="timeDisplay">25</span></div>
    </div>
    <div id="topAlert"></div>

    <div id="voicePanel">
        <div style="margin-bottom:5px; color:#00bfff; font-weight:bold;">SQUAD COMMS</div>
        <button class="voice-btn" id="btnJoinVoice" onclick="joinVoiceChat()">JOIN VOICE</button>
        <button class="voice-btn" id="btnMute" style="display:none;" onclick="toggleMute()">MUTE</button>
        <div class="voice-status" id="voiceStatus">Disconnected</div>
    </div>

    <div id="globalChat">
        <div id="chatHeader">
            <span>GLOBAL COMM LINK</span>
            <span style="font-size:10px; cursor:pointer;" onclick="toggleChat()">[X]</span>
        </div>
        <div id="chatMessages"></div>
        <div id="chatInputContainer">
            <input type="text" id="chatInput" placeholder="Press Enter to send...">
            <button id="chatSend" onclick="sendChat()">></button>
        </div>
    </div>

    <div class="game-stage">
        <div id="mapViewport">
            <div id="entitiesLayer"></div>
        </div>
    </div>

    <div id="mobileControls">
        <div id="joystick" class="mob-zone">
            <div id="joyKnob"></div>
        </div>
        <div id="btnAttack" class="mob-zone" onclick="emitAttack()">⚔️</div>
        <div id="btnLoot" class="mob-zone" onclick="emitLoot()">👋</div>
        <div id="btnChatMob" onclick="toggleChat()">💬</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // --- CONFIG & STATE ---
        const user = localStorage.getItem('gameUsername') || "Guest";
        const pass = localStorage.getItem('gamePass') || "";
        let isAdmin = false;
        let myId = null;
        let gameState = { players: {}, wolves: [], chests: [] };
        let camera = { x: 0, y: 0 };
        const MAP_SIZE = 1500;

        // Inputs
        const keys = {};
        let joyData = { x: 0, y: 0, active: false };

        // --- INIT ---
        socket.on('connect', () => {
            myId = socket.id;
            socket.emit('verifyIdentity', { username: user, password: pass });
        });

        socket.on('authResult', (res) => {
            isAdmin = res.isAdmin;
            if (isAdmin) {
                const msg = document.createElement('div');
                msg.style.color = '#0f0'; msg.innerText = "ADMIN ACCESS GRANTED";
                document.getElementById('chatMessages').appendChild(msg);
            }
        });

        socket.on('gameStarted', () => {
            document.getElementById('topAlert').innerText = "CONNECTION ESTABLISHED";
            document.getElementById('topAlert').style.opacity = 1;
            setTimeout(() => document.getElementById('topAlert').style.opacity = 0, 2000);
            renderLoop();
        });

        // --- GAME LOOP & RENDERING ---
        function renderLoop() {
            requestAnimationFrame(renderLoop);

            // 1. Process Inputs & Send to Server
            let dx = 0, dy = 0;
            if (keys['w'] || keys['ArrowUp']) dy -= 1;
            if (keys['s'] || keys['ArrowDown']) dy += 1;
            if (keys['a'] || keys['ArrowLeft']) dx -= 1;
            if (keys['d'] || keys['ArrowRight']) dx += 1;

            if (joyData.active) { dx = joyData.x; dy = joyData.y; }

            // Normalize
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len > 0) { dx /= len; dy /= len; }

            if (dx !== 0 || dy !== 0) {
                socket.emit('playerInput', { dx: dx, dy: dy });
            }

            // 2. Camera Follow Logic
            const myPlayer = gameState.players[myId];
            if (myPlayer) {
                const stageW = window.innerWidth;
                const stageH = window.innerHeight;
                camera.x = (stageW / 2) - myPlayer.x;
                camera.y = (stageH / 2) - myPlayer.y;

                // Clamp Camera
                camera.x = Math.min(0, Math.max(camera.x, stageW - MAP_SIZE));
                camera.y = Math.min(0, Math.max(camera.y, stageH - MAP_SIZE));

                document.getElementById('mapViewport').style.transform = `translate(${camera.x}px, ${camera.y}px)`;

                // Update HUD
                document.getElementById('hpDisplay').innerText = Math.floor(myPlayer.hp);
            }

            // 3. Render Entities
            renderEntities();
        }

        function renderEntities() {
            const layer = document.getElementById('entitiesLayer');
            layer.innerHTML = ''; // Inefficient but simple for now. 
            // *Optimization note: In a prod game, update existing DOM nodes instead of rebuilding.*

            // Chests
            gameState.chests.forEach((c, i) => {
                if (!c.opened) {
                    const el = document.createElement('div');
                    el.className = 'icon chest';
                    el.innerText = '📦';
                    el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
                    layer.appendChild(el);
                }
            });

            // Wolves
            gameState.wolves.forEach(w => {
                if (w.hp > 0) {
                    const el = document.createElement('div');
                    el.className = 'icon ' + (w.isWhite ? 'wolf-white' : 'wolf');
                    el.innerHTML = w.isWhite ? '🐺' : '🐺';
                    el.style.left = w.x + 'px'; el.style.top = w.y + 'px';

                    // HP Bar
                    const bar = document.createElement('div');
                    bar.style.position = 'absolute'; bar.style.top = '-10px'; bar.style.width = '100%'; bar.style.height = '4px'; bar.style.background = 'red';
                    const fill = document.createElement('div');
                    fill.style.width = (w.hp / w.maxHp * 100) + '%'; fill.style.height = '100%'; fill.style.background = 'lime';
                    bar.appendChild(fill);
                    el.appendChild(bar);

                    layer.appendChild(el);
                }
            });

            // Players
            let aliveCount = 0;
            Object.values(gameState.players).forEach(p => {
                if (p.alive) aliveCount++;
                const isMe = p.id === myId;
                const el = document.createElement('div');
                el.className = 'icon player-dot';
                el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
                el.style.backgroundColor = isMe ? '#ff4500' : '#00bfff';
                el.style.opacity = p.alive ? 1 : 0.3;
                el.innerText = '🏃';

                const name = document.createElement('div');
                name.className = 'player-name';
                name.innerText = p.username;
                el.appendChild(name);

                layer.appendChild(el);
            });
            document.getElementById('aliveDisplay').innerText = aliveCount;
        }

        // --- SOCKET DATA LISTENERS ---
        socket.on('gameStateUpdate', (state) => {
            gameState = state;
            document.getElementById('dayDisplay').innerText = state.day;
            document.getElementById('timeDisplay').innerText = state.timer > 0 ? state.timer : "HUNT";
        });

        socket.on('alert', (data) => {
            const al = document.getElementById('topAlert');
            al.innerText = data.msg;
            al.style.color = data.color;
            al.style.opacity = 1;
            setTimeout(() => al.style.opacity = 0, 3000);
        });

        socket.on('gameOver', (data) => {
            alert(`GAME OVER\nReason: ${data.reason}\nSurvived: ${data.days} Days`);
            window.location.href = 'gamelobby.html';
        });

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'Enter') {
                if (document.getElementById('globalChat').style.display === 'flex') return;
                emitAttack();
            }
            if (e.key.toLowerCase() === 'e') emitLoot();

            // CHAT TOGGLE: SHIFT + C
            if (e.shiftKey && e.key.toLowerCase() === 'c') {
                e.preventDefault();
                toggleChat();
            }
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function emitAttack() { socket.emit('playerAttack'); }
        function emitLoot() { socket.emit('tryLoot'); }

        // Mobile Logic
        const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isMobile) {
            document.getElementById('mobileControls').style.display = 'block';
            const joy = document.getElementById('joystick');
            const knob = document.getElementById('joyKnob');

            joy.addEventListener('touchstart', (e) => { joyData.active = true; handleJoy(e); }, { passive: false });
            joy.addEventListener('touchmove', (e) => { e.preventDefault(); handleJoy(e); }, { passive: false });
            joy.addEventListener('touchend', () => {
                joyData.active = false; joyData.x = 0; joyData.y = 0;
                knob.style.transform = `translate(-50%, -50%)`;
            });

            function handleJoy(e) {
                const rect = joy.getBoundingClientRect();
                const touch = e.touches[0];
                let x = touch.clientX - (rect.left + rect.width / 2);
                let y = touch.clientY - (rect.top + rect.height / 2);
                const max = 60;
                const dist = Math.sqrt(x * x + y * y);
                if (dist > max) { x = (x / dist) * max; y = (y / dist) * max; }
                knob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                joyData.x = x / max; joyData.y = y / max;
            }
        }

        // --- GLOBAL CHAT SYSTEM ---
        function toggleChat() {
            const chat = document.getElementById('globalChat');
            const isVisible = chat.style.display === 'flex';
            chat.style.display = isVisible ? 'none' : 'flex';
            if (!isVisible) document.getElementById('chatInput').focus();
        }

        function sendChat() {
            const inp = document.getElementById('chatInput');
            const text = inp.value.trim();
            if (!text) return;
            socket.emit('globalChat', { username: user, text: text, isAdmin: isAdmin });
            inp.value = '';
        }

        // Listen for incoming global messages
        socket.on('globalChatMsg', (msg) => {
            const box = document.getElementById('chatMessages');
            const el = document.createElement('div');
            el.className = 'msg-line';
            el.innerHTML = `<span style="color:${msg.color}; font-weight:bold;">[${msg.user}]</span>: ${msg.text}`;
            box.appendChild(el);
            box.scrollTop = box.scrollHeight;
        });

        // Hit Enter in chat input
        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        // --- VOICE CHAT (WEBRTC MESH) ---
        let localStream = null;
        let peers = {}; // socketId -> SimplePeer instance
        let isMuted = false;

        async function joinVoiceChat() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                document.getElementById('btnJoinVoice').style.display = 'none';
                document.getElementById('btnMute').style.display = 'inline-block';
                document.getElementById('voiceStatus').innerText = "Voice Active - Waiting for peers...";
                document.getElementById('voiceStatus').style.color = "#0f0";

                // Signal server we are ready
                socket.emit('joinGame', localStorage.getItem('gameRoomCode') || '0000', { username: user });
                // The server will trigger 'peerJoined' for others
            } catch (err) {
                alert("Microphone access denied or not found.");
                console.error(err);
            }
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            const btn = document.getElementById('btnMute');
            btn.innerText = isMuted ? "UNMUTE" : "MUTE";
            btn.style.background = isMuted ? "red" : "#333";
        }

        // WebRTC Signaling Logic
        socket.on('peerJoined', (data) => {
            if (!localStream) return;
            const peerId = data.signalId;
            createPeer(peerId, true); // We are initiator
        });

        socket.on('voiceSignalReceived', (data) => {
            if (!localStream) return;
            const peerId = data.from;
            if (!peers[peerId]) createPeer(peerId, false);
            peers[peerId].signal(data.signal);
        });

        socket.on('peerLeft', (data) => {
            if (peers[data.signalId]) {
                peers[data.signalId].destroy();
                delete peers[data.signalId];
            }
        });

        function createPeer(peerId, initiator) {
            const peer = new SimplePeer({
                initiator: initiator,
                trickle: false,
                stream: localStream
            });

            peer.on('signal', (signal) => {
                socket.emit('voiceSignal', { to: peerId, signal: signal });
            });

            peer.on('stream', (stream) => {
                const audio = document.createElement('audio');
                audio.srcObject = stream;
                audio.play();
                document.body.appendChild(audio); // Append invisible audio element
            });

            peers[peerId] = peer;
            document.getElementById('voiceStatus').innerText = `Connected to ${Object.keys(peers).length} peers`;
        }

    </script>
</body>

</html>
