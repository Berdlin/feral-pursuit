<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        /* Exact copy of realgame.html styles + chat styles */
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: monospace;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #080f08;
        }

        #camera {
            position: absolute;
            top: 0;
            left: 0;
            width: 1500px;
            height: 1500px;
            background-image: radial-gradient(#1a2b1a 2px, transparent 2px);
            background-size: 50px 50px;
            border: 5px solid #333;
        }

        .entity {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            text-align: center;
        }

        .player {
            background: url('https://img.icons8.com/color/48/pixel-cat.png') no-repeat center/cover;
            filter: drop-shadow(0 0 5px lime);
        }

        .wolf {
            background: url('https://img.icons8.com/color/48/werewolf.png') no-repeat center/cover;
        }

        .name {
            position: absolute;
            top: -20px;
            color: white;
            width: 100px;
            left: -30px;
            text-align: center;
            font-size: 10px;
        }

        #chatBox {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 300px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #555;
            display: flex;
            flex-direction: column;
            z-index: 200;
        }

        #chatLog {
            flex-grow: 1;
            overflow-y: scroll;
            color: #ccc;
            padding: 5px;
            font-size: 12px;
        }

        #chatIn {
            background: #222;
            border: none;
            color: white;
            padding: 5px;
        }

        #voicePanel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #222;
            color: white;
            padding: 5px;
            z-index: 200;
            font-size: 10px;
        }

        .talking {
            border: 2px solid #0f0;
        }

        /* Admin */
        #admin {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 2px solid lime;
            padding: 20px;
            z-index: 300;
            color: lime;
        }
    </style>
</head>

<body>
    <div id="game">
        <div id="camera">
            <div id="entities"></div>
        </div>
    </div>

    <div id="hud" style="position:fixed; top:10px; left:50%; color:white; z-index:200;">
        DAY: <span id="dDay">--</span> | TIME: <span id="dTime">--</span>
    </div>

    <div id="chatBox">
        <div id="chatLog"></div>
        <input type="text" id="chatIn" placeholder="Press Enter to chat...">
    </div>

    <div id="voicePanel">
        <div>VOICE CHAT <span id="voiceStatus" style="color:red;">OFF</span></div>
        <button onclick="toggleMute()">MUTE MIC</button>
    </div>

    <div id="admin">
        <h3>GLOBAL ADMIN</h3>
        <button onclick="adm('killWolves')">KILL ALL WOLVES</button>
        <button onclick="adm('spawnWhiteWolf')">SPAWN WHITE WOLF</button>
        <button onclick="adm('giveCoins')">GIVE 100 COINS (GLOBAL)</button>
        <button onclick="document.getElementById('admin').style.display='none'">CLOSE</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const user = JSON.parse(localStorage.getItem('fp_user'));
        const cls = localStorage.getItem('fp_class') || 'default';
        let myId = null;

        // AUTH CHECK
        if (!user) window.location.href = 'auth.html';

        // --- 1. SETUP & JOIN ---
        socket.on('connect', () => {
            myId = socket.id;
            socket.emit('host', { username: user.username, equippedClass: cls });
        });

        // --- 2. GAME LOOP & RENDERING ---
        const cam = document.getElementById('camera');
        const entDiv = document.getElementById('entities');

        socket.on('tick', (state) => {
            // Update HUD
            document.getElementById('dDay').innerText = state.status === 'chase' ? state.status.toUpperCase() : `DAY ${state.status}`;
            document.getElementById('dTime').innerText = state.time;

            entDiv.innerHTML = ''; // Clear (Inefficient but simple for consistency)

            // Render Players
            Object.values(state.players).forEach(p => {
                if (!p.alive) return;
                const el = document.createElement('div');
                el.className = 'entity player';
                el.style.left = p.x + 'px';
                el.style.top = p.y + 'px';
                el.innerHTML = `<div class="name">${p.username}</div>`;
                if (p.id === myId) {
                    // Camera Follow Me
                    cam.style.transform = `translate(${window.innerWidth / 2 - p.x}px, ${window.innerHeight / 2 - p.y}px)`;
                }
                entDiv.appendChild(el);
            });

            // Render Wolves
            state.wolves.forEach(w => {
                if (w.hp <= 0) return;
                const el = document.createElement('div');
                el.className = w.type === 'white' ? 'entity wolf white-wolf' : 'entity wolf';
                el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
                entDiv.appendChild(el);
            });
        });

        // --- 3. INPUTS ---
        const keys = {};
        window.onkeydown = (e) => {
            if (document.activeElement === document.getElementById('chatIn')) return;
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') socket.emit('action', { type: 'attack' });
            if (e.key === 'm') toggleMute();
            if (e.shiftKey && e.key === 'A' && user.username === 'beka_ei') document.getElementById('admin').style.display = 'block';
        };
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        setInterval(() => {
            let dx = 0, dy = 0;
            if (keys['w']) dy--; if (keys['s']) dy++;
            if (keys['a']) dx--; if (keys['d']) dx++;
            if (dx || dy) {
                // Normalize
                const len = Math.sqrt(dx * dx + dy * dy);
                socket.emit('move', { x: dx / len, y: dy / len });
            }
        }, 1000 / 30); // 30fps input rate

        // --- 4. ADMIN ---
        function adm(cmd) {
            let val = null;
            if (cmd === 'giveCoins') val = 100;
            socket.emit('adminCmd', { username: user.username, scope: 'global', cmd, val });
        }

        // --- 5. VOICE CHAT (PeerJS) ---
        let peer;
        let myStream;

        function initVoice() {
            peer = new Peer();
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                myStream = stream;
                document.getElementById('voiceStatus').innerText = "ON";
                document.getElementById('voiceStatus').style.color = "lime";

                peer.on('call', call => {
                    call.answer(stream);
                    call.on('stream', userAudio => playAudio(userAudio));
                });

                socket.emit('voice-join', peer.id);
            });
        }

        socket.on('user-connected', (userId) => {
            if (myStream) {
                const call = peer.call(userId, myStream);
                call.on('stream', userAudio => playAudio(userAudio));
            }
        });

        function playAudio(stream) {
            const audio = document.createElement('audio');
            audio.srcObject = stream;
            audio.play();
        }

        function toggleMute() {
            if (myStream) {
                const track = myStream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                alert(track.enabled ? "Mic On" : "Mic Muted");
            } else {
                initVoice();
            }
        }
    </script>
</body>

</html>
