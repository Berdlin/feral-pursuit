<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feral Pursuit - Multiplayer</title>
    <style>
        body {
            margin: 0;
            background: #080808;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }

        #gameStage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 1s;
        }

        .scary-mode {
            filter: sepia(0.8) hue-rotate(-50deg) contrast(1.2);
        }

        #mapLayer {
            width: 1500px;
            height: 1500px;
            position: absolute;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            border: 5px solid #333;
            transition: transform 0.1s linear;
        }

        .entity {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: left 0.2s linear, top 0.2s linear;
        }

        .player-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 10;
        }

        .wolf {
            width: 50px;
            height: 50px;
            background: #400;
            border: 2px solid red;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            box-shadow: 0 0 15px red;
            z-index: 5;
        }

        .white-wolf {
            width: 100px;
            height: 100px;
            background: white;
            border: 4px solid gold;
            font-size: 50px;
            box-shadow: 0 0 30px white;
            z-index: 20;
        }

        .chest {
            font-size: 30px;
            z-index: 4;
        }

        /* BOSS BAR */
        #bossBar {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 30px;
            background: #222;
            border: 2px solid gold;
            z-index: 150;
            display: none;
        }

        #bossBarFill {
            height: 100%;
            background: white;
            width: 100%;
            transition: width 0.2s;
        }

        #bossLabel {
            position: absolute;
            top: -20px;
            color: gold;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        /* ADMIN PANEL */
        #adminPanel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid lime;
            padding: 20px;
            z-index: 200;
            display: none;
            color: lime;
            font-family: monospace;
        }

        .adm-btn {
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            background: #003300;
            color: white;
            border: 1px solid lime;
            cursor: pointer;
        }

        .tab-btn {
            width: 48%;
            padding: 5px;
            cursor: pointer;
            background: #111;
            color: #666;
            border: 1px solid #666;
        }

        .tab-btn.active {
            border-color: lime;
            color: lime;
        }

        /* HUD & CHAT (Abbreviated from original for brevity, assume existing styles) */
        .hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            color: #ccc;
            z-index: 100;
            font-weight: bold;
        }

        #alertBox {
            position: fixed;
            top: 130px;
            width: 100%;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 0 0 10px #000;
            z-index: 150;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #chatContainer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 350px;
            height: 250px;
            background: rgba(20, 20, 20, 0.65);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        #chatHistory {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        #chatInput {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="alertBox"></div>
    <div id="bossBar">
        <div id="bossLabel">THE WHITE WOLF</div>
        <div id="bossBarFill"></div>
    </div>

    <div class="hud">Day: <span id="dayDisp">1</span> | HP: <span id="hpDisp">100</span> | Time: <span
            id="timeDisp">--</span></div>

    <div id="adminPanel">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <button class="tab-btn active" onclick="switchTab('local')">LOCAL</button>
            <button class="tab-btn" onclick="switchTab('global')">GLOBAL</button>
        </div>

        <div id="localTab">
            <input type="number" id="admDay" placeholder="Day" style="width:50px"> <button
                onclick="sendAdm('setDay')">Set Day</button>
            <button class="adm-btn" onclick="sendAdm('spawnDogs', {val:5})">Spawn 5 Dogs</button>
            <button class="adm-btn" onclick="sendAdm('killWolves')">Kill Wolves</button>
            <button class="adm-btn" onclick="sendAdm('getStuff')">Get Gear</button>
            <button class="adm-btn" style="color:gold; border-color:gold;" onclick="sendAdm('spawnWhiteWolf')">SPAWN
                BOSS</button>
        </div>

        <div id="globalTab" style="display:none;">
            <p>AFFECTS ALL PLAYERS ON SERVER</p>
            <input type="text" id="gChat" placeholder="Global Announce"> <button
                onclick="sendGlobal('globalChat')">Send</button>
            <button class="adm-btn" style="background:#500" onclick="sendGlobal('globalKill')">KILL ALL ENTITIES
                (GLOBAL)</button>
        </div>
        <button class="adm-btn" onclick="document.getElementById('adminPanel').style.display='none'">Close</button>
    </div>

    <div id="chatContainer">
        <div id="chatHistory"></div>
        <input type="text" id="chatInput" placeholder="Radio channel...">
    </div>

    <div id="gameStage">
        <div id="mapLayer">
            <div id="entities"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const myUser = localStorage.getItem('gameUsername') || "Guest";
        const myPass = localStorage.getItem('gamePass') || "";
        let isAdmin = false;

        // AUDIO
        const audio = {
            step: new Audio('footstep.mp3'),
            growl: new Audio('wolf_growl.mp3'),
            scary: new Audio('scary_theme.mp3')
        };

        // ... [Include standard movement logic from original code here for brevity] ...
        // Movement Logic setup
        let myPos = { x: 750, y: 750 }; let keyState = {};
        window.onkeydown = (e) => {
            if (document.activeElement === document.getElementById('chatInput')) return;
            keyState[e.key.toLowerCase()] = true;
            if (e.key === ' ') socket.emit('playerAction', { type: 'attack' });
            if (e.key === 'e') socket.emit('playerAction', { type: 'loot' });

            // ADMIN PANEL TRIGGER
            if (e.shiftKey && e.key.toLowerCase() === 'a') {
                if (myUser.toLowerCase() === 'beka_ei' && isAdmin) {
                    document.getElementById('adminPanel').style.display = 'block';
                }
            }
        };
        window.onkeyup = (e) => keyState[e.key.toLowerCase()] = false;

        socket.on('connect', () => {
            socket.emit('verifyIdentity', { username: myUser, password: myPass });
            const code = localStorage.getItem('gameRoomCode');
            if (code) socket.emit('joinGame', code, { username: myUser });
        });

        socket.on('authResult', (res) => {
            if (res.success && res.isAdmin) isAdmin = true;
        });

        // --- VISUALS & AUDIO ---
        socket.on('alert', (d) => {
            const a = document.getElementById('alertBox');
            a.innerText = d.msg; a.style.color = d.color; a.style.opacity = 1;
            setTimeout(() => a.style.opacity = 0, 3000);
            if (d.sound && audio[d.sound]) audio[d.sound].play();
        });

        socket.on('phaseChange', (phase) => {
            const stg = document.getElementById('gameStage');
            if (phase === 'chase') { stg.classList.add('scary-mode'); audio.scary.play(); }
            else { stg.classList.remove('scary-mode'); audio.scary.pause(); audio.scary.currentTime = 0; }
        });

        // --- BOSS LOGIC ---
        socket.on('bossSpawned', (data) => {
            document.getElementById('bossBar').style.display = 'block';
            document.getElementById('bossBarFill').style.width = '100%';
        });

        socket.on('bossDefeated', (data) => {
            document.getElementById('bossBar').style.display = 'none';
            let coins = parseInt(localStorage.getItem('feral_coins') || "0");
            localStorage.setItem('feral_coins', coins + data.coins);
        });

        // --- RENDER LOOP ---
        socket.on('gameStateUpdate', (s) => {
            document.getElementById('dayDisp').innerText = s.day;
            document.getElementById('timeDisp').innerText = s.timer;
            if (s.players[socket.id]) {
                document.getElementById('hpDisp').innerText = Math.floor(s.players[socket.id].hp);
                myPos.x = s.players[socket.id].x; myPos.y = s.players[socket.id].y; // Snap for simplicity
            }

            const ents = document.getElementById('entities');
            ents.innerHTML = ''; // Clear frame

            // Render Players
            for (const pid in s.players) {
                if (!s.players[pid].alive) continue;
                const p = s.players[pid];
                const d = document.createElement('div'); d.className = 'entity player-dot';
                d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; d.style.borderColor = p.color;
                d.innerText = '🏃';
                ents.appendChild(d);
            }

            // Render Wolves (Standard + Boss)
            s.wolves.forEach(w => {
                if (w.hp > 0) {
                    const d = document.createElement('div');
                    d.className = w.isBoss ? 'entity white-wolf' : 'entity wolf';
                    d.style.left = w.x + 'px'; d.style.top = w.y + 'px';
                    d.innerText = '🐺';
                    ents.appendChild(d);

                    // Boss Bar Update logic inside loop is inefficient but functional for this scope
                    if (w.isBoss) {
                        const pct = (w.hp / w.maxHp) * 100;
                        document.getElementById('bossBarFill').style.width = pct + '%';
                    }
                }
            });

            // Render Chests
            s.chests.forEach(c => {
                if (!c.opened) {
                    const d = document.createElement('div'); d.className = 'entity chest';
                    d.style.left = c.x + 'px'; d.style.top = c.y + 'px'; d.innerText = '📦';
                    ents.appendChild(d);
                }
            });

            // Camera
            const map = document.getElementById('mapLayer');
            const stage = document.getElementById('gameStage');
            let cx = (stage.clientWidth / 2) - myPos.x;
            let cy = (stage.clientHeight / 2) - myPos.y;
            map.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
        });

        // --- ADMIN SENDERS ---
        function switchTab(t) {
            document.getElementById('localTab').style.display = t === 'local' ? 'block' : 'none';
            document.getElementById('globalTab').style.display = t === 'global' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        function sendAdm(act, extra = {}) {
            const day = document.getElementById('admDay').value;
            if (act === 'setDay') extra.val = day;
            socket.emit('adminCmd', { action: act, ...extra });
        }
        function sendGlobal(act) {
            const txt = document.getElementById('gChat').value;
            socket.emit('globalAdminCmd', { action: act, val: txt });
        }

        // --- CHAT LOGIC ---
        const chatIn = document.getElementById('chatInput');
        chatIn.onkeydown = (e) => {
            if (e.key === 'Enter' && chatIn.value.trim()) {
                socket.emit('sendChat', chatIn.value.trim());
                chatIn.value = '';
            }
        };
        socket.on('chatMsg', (d) => {
            const h = document.getElementById('chatHistory');
            h.innerHTML += `<div><span style="color:${d.color}">${d.user}:</span> ${d.text}</div>`;
        });
    </script>
</body>

</html>
