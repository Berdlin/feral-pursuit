<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Pursuit - Online</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #080808;
            color: #ccc;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .game-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .game-stage {
            flex-grow: 1;
            position: relative;
            background-color: #050805;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 2s;
        }

        .game-stage.scary-mode {
            filter: sepia(0.6) hue-rotate(-50deg) contrast(1.3) brightness(0.7);
        }

        #mapViewport {
            width: 1500px;
            height: 1500px;
            background-color: #0c180f;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            border: 5px solid #222;
            position: absolute;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        #bloodMoonOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.1), rgba(100, 0, 0, 0.6));
            pointer-events: none;
            z-index: 80;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        /* BOSS BAR */
        #bossBarContainer {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 25px;
            background: #333;
            border: 2px solid white;
            z-index: 200;
            display: none;
        }

        #bossBarFill {
            width: 100%;
            height: 100%;
            background: #a00;
            transition: width 0.2s;
        }

        #bossName {
            position: absolute;
            top: -25px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            text-shadow: 0 0 5px black;
        }

        .inventory-sidebar {
            width: 280px;
            background-color: #111;
            border-right: 2px solid #333;
            height: 100vh;
            position: absolute;
            left: 0;
            top: 0;
            transform: translateX(-100%);
            transition: transform 0.3s;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .inventory-sidebar.visible {
            transform: translateX(0);
        }

        .inv-item {
            background: #222;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        #adminPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ff00;
            padding: 20px;
            z-index: 300;
            display: none;
            color: #00ff00;
            font-family: monospace;
            max-height: 80vh;
            overflow-y: auto;
        }

        .admin-row {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-btn {
            width: 100%;
            background: #003300;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 8px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: bold;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #111;
            color: green;
            border: 1px solid green;
            cursor: pointer;
        }

        .tab-btn.active {
            background: green;
            color: black;
        }

        .icon {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            z-index: 10;
        }

        .player-ent {
            border-radius: 50%;
            border: 2px solid #fff;
            font-size: 1.5em;
            background: #444;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            position: absolute;
            transform: translate(-50%, -50%);
        }

        .wolf-entity {
            width: 50px;
            height: 50px;
            background: #200;
            border-radius: 50%;
            border: 2px solid #f00;
            z-index: 9;
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            transition: left 0.1s linear, top 0.1s linear;
        }

        .white-wolf {
            background: #fff;
            border: 3px solid gold;
            width: 100px;
            height: 100px;
            font-size: 4em;
            box-shadow: 0 0 30px white;
            z-index: 15;
            color: black;
        }

        .chest {
            z-index: 8;
            cursor: pointer;
            font-size: 2em;
            filter: drop-shadow(0 0 5px gold);
        }

        #gameOverOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }

        .overlay-btn {
            margin: 10px;
            padding: 15px 30px;
            background: #ff4500;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 1.2em;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 150;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            color: white;
        }

        #topAlertBox {
            position: absolute;
            top: 120px;
            width: 100%;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            z-index: 160;
            text-shadow: 0 0 5px black;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>

<body>
    <div id="bloodMoonOverlay"></div>
    <div id="bossBarContainer">
        <div id="bossName">THE WHITE WOLF</div>
        <div id="bossBarFill"></div>
    </div>

    <div class="game-wrapper">
        <div id="inventoryPanel" class="inventory-sidebar">
            <div style="padding: 20px; text-align: center; color: #ff4500;">INVENTORY [Q]</div>
            <div id="invList" style="padding:10px;"></div>
        </div>

        <div class="hud-top">
            <div>DAY: <span id="levelDisplay">1</span></div>
            <div>HP: <span id="hpDisplay">100</span></div>
            <div>TIME: <span id="timeDisplay">00:20</span></div>
        </div>
        <div id="topAlertBox"></div>

        <div id="adminPanel">
            <div style="display:flex; margin-bottom:10px;">
                <button class="tab-btn active" onclick="switchTab('local')">LOCAL</button>
                <button class="tab-btn" onclick="switchTab('global')">GLOBAL</button>
            </div>

            <div id="admLocal">
                <div class="admin-row"><label>Set Day:</label><input type="number" id="admDay" value="1"
                        style="width:50px;"><button class="admin-btn" style="width:auto"
                        onclick="sendAdm('setDay', document.getElementById('admDay').value)">SET</button></div>
                <div class="admin-row"><label>Stats:</label><input type="number" id="admHp" placeholder="HP"
                        style="width:40px;"><input type="number" id="admDmg" placeholder="DMG"
                        style="width:40px;"><button class="admin-btn" style="width:auto"
                        onclick="sendAdm('setStats')">SET</button></div>
                <button class="admin-btn" onclick="sendAdm('spawnDogs')">SPAWN DOGS</button>
                <button class="admin-btn" onclick="sendAdm('getStuff')">GET OP ITEMS</button>
                <button class="admin-btn" onclick="sendAdm('spawnWhiteWolf')"
                    style="color:black; background:gold;">SPAWN WHITE WOLF</button>
                <button class="admin-btn" onclick="sendAdm('killWolves')" style="background:#500;">KILL ALL
                    WOLVES</button>
            </div>

            <div id="admGlobal" style="display:none;">
                <div class="admin-row"><input type="text" id="gChat" placeholder="Global Message..."><button
                        class="admin-btn" style="width:auto"
                        onclick="sendGlobal('globalChat', document.getElementById('gChat').value)">SEND</button></div>
                <button class="admin-btn" onclick="sendGlobal('globalKill')" style="background:#500;">GLOBAL KILL ALL
                    WOLVES</button>
            </div>

            <button class="admin-btn"
                onclick="document.getElementById('adminPanel').style.display='none'">CLOSE</button>
        </div>

        <div class="game-stage" id="stage">
            <div id="mapViewport">
                <div id="entitiesLayer"></div>
            </div>
        </div>
    </div>

    <div id="gameOverOverlay">
        <h1 id="endTitle" style="color:white; font-size:3em;">GAME OVER</h1>
        <p id="endReason" style="color:#aaa; font-size:1.5em; margin-bottom: 30px;"></p>
        <button onclick="location.href='gamelobby.html'" class="overlay-btn">LOBBY</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const myUsername = localStorage.getItem('gameUsername');
        const myPass = localStorage.getItem('gamePass'); // Needed for server auth check
        let myId = null;
        let isAdmin = false;

        const audio = {
            step: new Audio('footstep.mp3'),
            scary: new Audio('scary_theme.mp3'),
            growl: new Audio('wolf_growl.mp3'),
            jump: new Audio('jumpscare.mp3')
        };
        audio.scary.loop = true;
        Object.values(audio).forEach(a => a.volume = 0.3);

        // Verify Identity + Admin Status
        socket.emit('verifyIdentity', { username: myUsername, password: myPass });
        socket.on('authResult', (res) => {
            if (!res.success) { alert(res.msg); location.href = 'gamelobby.html'; }
            if (res.isAdmin) isAdmin = true;
        });

        // Re-Join the room stored in lobby
        const roomCode = localStorage.getItem('gameRoomCode');
        socket.emit('joinGame', roomCode, { username: myUsername });
        socket.on('joinFailed', () => location.href = 'gamelobby.html');

        // INPUTS
        const keyStates = {};
        window.addEventListener('keydown', e => {
            keyStates[e.key.toLowerCase()] = true;
            if (e.key === ' ' || e.key === 'Enter') socket.emit('playerAction', { type: 'attack' });
            if (e.key === 'e') socket.emit('playerAction', { type: 'loot' });
            if (e.key === 'q') document.getElementById('inventoryPanel').classList.toggle('visible');
            if (e.key >= '1' && e.key <= '9') socket.emit('playerAction', { type: 'useItem', index: parseInt(e.key) - 1 });

            // ADMIN PANEL CHECK
            if (e.shiftKey && e.key.toLowerCase() === 'a' && isAdmin) {
                document.getElementById('adminPanel').style.display = 'block';
            }
        });
        window.addEventListener('keyup', e => keyStates[e.key.toLowerCase()] = false);

        // GAME LOOP
        setInterval(() => {
            let dx = 0, dy = 0;
            if (keyStates['w']) dy--; if (keyStates['s']) dy++;
            if (keyStates['a']) dx--; if (keyStates['d']) dx++;
            if (dx || dy) {
                socket.emit('playerMove', { dx, dy });
                if (audio.step.paused) audio.step.play();
            } else {
                audio.step.pause(); audio.step.currentTime = 0;
            }
        }, 1000 / 30);

        // RENDER
        socket.on('gameStateUpdate', (state) => {
            // Update HUD
            document.getElementById('levelDisplay').innerText = state.day;
            document.getElementById('timeDisplay').innerText = state.timer;

            // Phase Logic
            if (state.status === 'chase') {
                document.getElementById('stage').classList.add('scary-mode');
                document.getElementById('bloodMoonOverlay').style.opacity = 0.5;
                if (audio.scary.paused) audio.scary.play();
            } else {
                document.getElementById('stage').classList.remove('scary-mode');
                document.getElementById('bloodMoonOverlay').style.opacity = 0;
                audio.scary.pause();
            }

            const layer = document.getElementById('entitiesLayer');
            layer.innerHTML = '';

            // Camera Centering
            if (state.players[socket.id]) {
                const me = state.players[socket.id];
                document.getElementById('hpDisplay').innerText = me.hp;
                updateInventory(me.inventory);

                const stage = document.getElementById('stage');
                let cx = (stage.clientWidth / 2) - me.x;
                let cy = (stage.clientHeight / 2) - me.y;
                document.getElementById('mapViewport').style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
            }

            // Render Players
            Object.values(state.players).forEach(p => {
                if (!p.alive) return;
                const el = document.createElement('div');
                el.className = 'player-ent'; el.innerText = '🏃';
                el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
                el.style.background = p.color;
                // Add Name Tag
                const tag = document.createElement('div');
                tag.innerText = p.username;
                tag.style.position = 'absolute'; tag.style.top = '-20px'; tag.style.fontSize = '0.5em'; tag.style.width = '100px'; tag.style.textAlign = 'center';
                el.appendChild(tag);
                layer.appendChild(el);

                // Render Dogs
                if (p.companions) {
                    p.companions.forEach(d => {
                        const dog = document.createElement('div');
                        dog.className = 'wolf-entity'; dog.innerText = '🐕';
                        dog.style.background = 'blue'; dog.style.borderColor = 'white';
                        dog.style.left = d.x + 'px'; dog.style.top = d.y + 'px';
                        layer.appendChild(dog);
                    });
                }
            });

            // Render Wolves
            state.wolves.forEach(w => {
                if (w.hp <= 0) return;
                const el = document.createElement('div');
                el.className = w.isBoss ? 'wolf-entity white-wolf' : 'wolf-entity';
                el.innerText = '🐺';
                el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
                layer.appendChild(el);
            });

            // Render Chests
            state.chests.forEach((c, i) => {
                if (c.opened) return;
                const el = document.createElement('div');
                el.className = 'icon chest'; el.innerText = '📦';
                el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
                layer.appendChild(el);
            });
        });

        socket.on('alert', (data) => {
            const box = document.getElementById('topAlertBox');
            box.innerText = data.msg; box.style.color = data.color; box.style.opacity = 1;
            setTimeout(() => box.style.opacity = 0, 3000);
            if (data.sound && audio[data.sound]) audio[data.sound].play();
        });

        socket.on('bossSpawned', (data) => {
            document.getElementById('bossBarContainer').style.display = 'block';
            document.getElementById('bossBarFill').style.width = '100%';
        });
        socket.on('bossUpdate', (data) => {
            document.getElementById('bossBarFill').style.width = (data.hp / data.max * 100) + '%';
        });
        socket.on('bossDefeated', (data) => {
            document.getElementById('bossBarContainer').style.display = 'none';
            // Coins logic if you want multiplayer persistence requires DB
        });

        socket.on('gameOver', (data) => {
            document.getElementById('gameOverOverlay').style.display = 'flex';
            document.getElementById('endReason').innerText = data.reason;
        });

        function updateInventory(items) {
            const l = document.getElementById('invList'); l.innerHTML = '';
            items.forEach((it, i) => { l.innerHTML += `<div class="inv-item" onclick="socket.emit('playerAction', {type:'useItem', index:${i}})">${it.icon || '?'} ${it.name}</div>`; });
        }

        // Admin Helpers
        function switchTab(t) {
            document.getElementById('admLocal').style.display = t === 'local' ? 'block' : 'none';
            document.getElementById('admGlobal').style.display = t === 'global' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        function sendAdm(action, val) {
            const data = { action: action, val: val };
            if (action === 'setStats') { data.hp = document.getElementById('admHp').value; data.dmg = document.getElementById('admDmg').value; }
            socket.emit('adminCmd', data);
        }
        function sendGlobal(action, val) { socket.emit('globalAdminCmd', { action, val }); }
    </script>
</body>

</html>
