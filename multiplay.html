<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vt323&display=swap');

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        #gameStage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mapLayer {
            width: 1500px;
            height: 1500px;
            position: absolute;
            background-color: #0b1a0b;
            background-image: radial-gradient(#1a2e1a 15%, transparent 16%), radial-gradient(#1a2e1a 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            border: 5px solid #333;
            image-rendering: pixelated;
        }

        .player-dot {
            width: 32px;
            height: 32px;
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .name-tag {
            position: absolute;
            top: -15px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 12px;
            padding: 2px;
            white-space: nowrap;
        }

        #chatBox {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 250px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #555;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        #chatMsgs {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.9em;
        }

        #chatInput {
            background: #222;
            border: none;
            border-top: 1px solid #555;
            color: white;
            padding: 10px;
            font-family: inherit;
        }

        #voiceStatus {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #0f0;
            font-size: 0.8em;
            z-index: 200;
        }

        /* FX Classes */
        .white-wolf {
            filter: invert(1) drop-shadow(0 0 10px blue);
            transform: scale(1.5);
        }

        .jumpscare {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }
    </style>
</head>

<body>
    <div id="voiceStatus">VOICE: OFF</div>
    <div id="gameStage">
        <div id="mapLayer">
            <div id="entities"></div>
        </div>
    </div>

    <div id="chatBox">
        <div id="chatMsgs"></div>
        <input id="chatInput" placeholder="RADIO CHATTER..." onkeydown="sendChat(event)">
    </div>

    <audio id="sfx-step" src="assets/footstep.mp3"></audio>
    <audio id="sfx-scary" src="assets/jumpscare.mp3"></audio>
    <audio id="sfx-wolf" src="assets/wolf_growl.mp3"></audio>
    <audio id="bgm-theme" src="assets/scary_theme.mp3" loop></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const myUser = localStorage.getItem('gameUsername');
        let myId = null;
        let myPos = { x: 750, y: 750 };
        const speed = 7;
        const keys = {};

        // --- VOICE CHAT (PeerJS) ---
        const peer = new Peer();
        let myStream = null;

        peer.on('open', (id) => {
            document.getElementById('voiceStatus').innerText = "VOICE: READY";
            socket.emit('voiceId', id);
        });

        peer.on('call', (call) => {
            call.answer(myStream);
            const audio = document.createElement('audio');
            call.on('stream', stream => { audio.srcObject = stream; audio.play(); });
        });

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            myStream = stream;
            document.getElementById('voiceStatus').innerText = "VOICE: ON";
        }).catch(e => document.getElementById('voiceStatus').innerText = "MIC ERROR");

        socket.on('userJoinedVoice', (data) => {
            if (!myStream) return;
            const call = peer.call(data.peerId, myStream);
            const audio = document.createElement('audio');
            call.on('stream', stream => { audio.srcObject = stream; audio.play(); });
        });

        // --- GAME LOGIC ---
        socket.on('connect', () => {
            myId = socket.id;
            const code = localStorage.getItem('gameRoomCode');
            socket.emit('joinGame', code, { username: myUser });
            document.getElementById('bgm-theme').volume = 0.3;
            document.body.onclick = () => document.getElementById('bgm-theme').play();
        });

        // --- AUDIO FX ---
        socket.on('fx', (data) => {
            if (data.type === 'scary') document.getElementById('sfx-wolf').play();
            if (data.type === 'hit') {
                document.getElementById('sfx-scary').play();
                document.body.classList.add('jumpscare');
                setTimeout(() => document.body.classList.remove('jumpscare'), 500);
            }
            if (data.type === 'attack') {
                // Play swing sound if you had one
            }
        });

        function loop() {
            let dx = 0, dy = 0;
            if (keys['w']) dy--; if (keys['s']) dy++;
            if (keys['a']) dx--; if (keys['d']) dx++;

            if (dx || dy) {
                myPos.x += dx * speed; myPos.y += dy * speed;
                myPos.x = Math.max(0, Math.min(1500, myPos.x));
                myPos.y = Math.max(0, Math.min(1500, myPos.y));

                socket.emit('playerMove', { dx, dy });

                if (Math.random() < 0.05) document.getElementById('sfx-step').play();

                const map = document.getElementById('mapLayer');
                const cx = window.innerWidth / 2 - myPos.x;
                const cy = window.innerHeight / 2 - myPos.y;
                map.style.transform = `translate(${cx}px, ${cy}px)`;
            }
            requestAnimationFrame(loop);
        }

        window.onkeydown = e => { if (document.activeElement !== document.getElementById('chatInput')) keys[e.key.toLowerCase()] = true; };
        window.onkeyup = e => keys[e.key.toLowerCase()] = false;

        // --- SYNC UPDATE (Fix Rubber Banding) ---
        socket.on('gameStateUpdate', (state) => {
            const ents = document.getElementById('entities');
            ents.innerHTML = '';

            for (let pid in state.players) {
                const p = state.players[pid];
                if (!p.alive) continue;

                // Only snap position if we drift too far (Rubber Band Fix)
                if (pid === myId) {
                    const dist = Math.hypot(p.x - myPos.x, p.y - myPos.y);
                    if (dist > 150) { myPos.x = p.x; myPos.y = p.y; }
                }

                const el = document.createElement('div');
                el.className = 'player-dot';
                el.style.left = (pid === myId ? myPos.x : p.x) + 'px';
                el.style.top = (pid === myId ? myPos.y : p.y) + 'px';
                el.innerHTML = `<div class="name-tag">${p.username}</div><div style="width:30px;height:30px;background:${p.color};box-shadow:4px 4px 0 white;"></div>`;
                ents.appendChild(el);
            }

            state.wolves.forEach(w => {
                if (w.hp > 0) {
                    const el = document.createElement('div');
                    el.style.position = 'absolute'; el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
                    el.style.fontSize = '40px'; el.innerText = '🐺';
                    if (w.isWhite) el.className = 'white-wolf';
                    ents.appendChild(el);
                }
            });
        });

        function sendChat(e) {
            if (e.key === 'Enter') {
                const txt = document.getElementById('chatInput').value;
                if (txt) { socket.emit('sendChat', txt); document.getElementById('chatInput').value = ''; }
            }
        }
        socket.on('chatMsg', msg => {
            const box = document.getElementById('chatMsgs');
            box.innerHTML += `<div><b style="color:${msg.color}">${msg.user}:</b> ${msg.text}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        requestAnimationFrame(loop);
    </script>
</body>

</html>
